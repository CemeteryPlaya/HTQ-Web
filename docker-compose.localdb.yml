# ═══════════════════════════════════════════════════════════════════════════════
#  Локальная БД — оверрайд для разработки и E2E.
#
#  ЗАЧЕМ. Корневой `.env` задаёт `DB_HOST=45.10.110.212` — это БОЕВАЯ база на
#  VPS, и якорь `x-django-env` в docker-compose.yml подмешивает её во все
#  backend-сервисы. Значит стек, поднятый обычным способом, работает против
#  прода: любой E2E-тест, любая проверка «а что если удалить», любая миграция
#  уходят туда.
#
#  Этот файл пинит `DB_HOST: db` на каждый backend-процесс — жёстко, без
#  подстановки из окружения, так что переопределить его случайно нельзя. `db`
#  это контейнер Postgres из docker-compose.yml (том `postgres_data`), то есть
#  та самая локальная база, куда применяются миграции с хоста через :55432.
#
#  ПРИМЕНЕНИЕ (dev + локальная БД):
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#                   -f docker-compose.localdb.yml up -d
#
#  E2E прогоняются только по такому стеку. Проверить, куда реально смотрит
#  поднятый backend:
#    docker compose ... exec backend-web printenv DB_HOST     # ожидаем: db
#
#  Корневой `.env` этот файл НЕ трогает — боевые значения остаются на месте
#  для тех, кому они нужны. Схему на VPS обновляют вручную и осознанно.
# ═══════════════════════════════════════════════════════════════════════════════

x-local-db: &local-db
  DB_HOST: db
  DB_PORT: 5432
  # Учётка тоже пинится, а не берётся из `.env`: там лежит боевой пароль, и
  # с ним контейнер не пустят в локальную базу. Том `postgres_data` создан с
  # дефолтом из `htqweb/settings/base.py` — Postgres применяет
  # POSTGRES_PASSWORD только при ПЕРВОЙ инициализации каталога данных, потом
  # переменная игнорируется. Это dev-пароль локального контейнера, не секрет.
  DB_NAME: htqweb
  DB_USER: htqweb
  DB_PASSWORD: change-me

services:
  backend-web:
    environment:
      <<: *local-db
      # Миграции на локальной базе — норма: она для того и заведена.
      RUN_MIGRATIONS: "1"

  backend-asgi:
    environment:
      <<: *local-db

  backend-worker:
    environment:
      <<: *local-db

  backend-beat:
    environment:
      <<: *local-db

  flower:
    environment:
      <<: *local-db
