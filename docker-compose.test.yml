# ═══════════════════════════════════════════════════════════════════════════════
# HTQWeb — тестовый Postgres (для backend-сюиты pytest)
# ═══════════════════════════════════════════════════════════════════════════════
# Самодостаточный стек: поднимает ТОЛЬКО одноразовый Postgres на host-порту :55432,
# куда pytest-django делает CREATE/DROP test_htqweb. Боевую БД (VPS 45.10.110.212)
# НЕ трогает — отдельный контейнер, отдельный volume.
#
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && .venv/Scripts/python.exe -m pytest
#   docker compose -f docker-compose.test.yml down -v      # снести с данными
#
# ⚠️ Поднимать/пересоздавать db ТОЛЬКО через `compose up -d` — НЕ `docker restart`
#    (плоский restart НЕ применяет публикацию порта :55432 → pytest виснет на
#    ConnectionTimeout). Проверка: `docker port htqweb-test-db-1` → 0.0.0.0:55432.
#
# Креды тестовой БД независимы от боевых (.env): settings/test.py читает
# TEST_DB_* (дефолт htqweb/change-me), поэтому app_user/пароль VPS сюда не текут.
name: htqweb-test

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-htqweb}
      POSTGRES_USER: ${TEST_DB_USER:-htqweb}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-change-me}
    ports:
      - "${DB_HOST_PORT:-55432}:5432"
    volumes:
      - test_pg_data:/var/lib/postgresql/data
      - ./infra/db/init-ltree.sql:/docker-entrypoint-initdb.d/01-ltree.sql:ro
    # max_connections=300: длинная Django-сюита + тесты @django_db(transaction=True)
    # (FK/constraint-проверки) под дефолтными 100 к концу прогона упираются в лимит
    # (SystemExit-teardown, ERROR в хвосте). См. backend/README-tests.md.
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-htqweb}"]
      interval: 5s
      retries: 10

volumes:
  test_pg_data:
