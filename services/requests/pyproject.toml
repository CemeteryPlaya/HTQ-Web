[project]
name = "requests-service"
version = "0.1.0"
description = "HTQWeb requests microservice"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../../libs"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.ruff]
line-length = 120
target-version = "py314"
