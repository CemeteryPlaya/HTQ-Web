# ═══════════════════════════════════════════════════════════════════════════
# HTQWeb API Gateway (Nginx) — единый Django-backend
# ═══════════════════════════════════════════════════════════════════════════
#
# Архитектура (после миграции FastAPI → Django, фаза 11):
#   React SPA -> Nginx -> ЕДИНЫЙ Django-backend
#     • backend      — gunicorn/WSGI (весь /api/*, django-admin, static)
#     • backend_asgi — uvicorn/ASGI (SSE /api/requests/v1/stream, WS /ws/ messenger)
#   SFU (WebRTC-сигналинг), Grafana, Prometheus — как раньше.
#
# HTTPS: получить cert через certbot (webroot /var/www/certbot), затем
# раскомментировать 301-редирект и HTTPS-блок в конце (те же location'ы).
# ═══════════════════════════════════════════════════════════════════════════

# ─── Upstreams ───────────────────────────────────────────────────────────────
upstream backend {
    server backend-web:8000;      # gunicorn WSGI
    keepalive 16;
}

upstream backend_asgi {
    server backend-asgi:8000;     # uvicorn ASGI (SSE + WebSocket)
    keepalive 16;
}

upstream grafana {
    server grafana:3000;
    keepalive 16;
}

# ─── Rate limiting ───────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=5r/m;
limit_req_zone $binary_remote_addr zone=websocket:10m    rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_public:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=media_upload:10m rate=5r/s;

# ─── Edge-кэш публичных медиа-вариантов (превью) ────────────────────────────
proxy_cache_path /var/cache/nginx/media keys_zone=media_cache:10m
                 max_size=2g inactive=7d use_temp_path=off;

log_format gateway '$time_iso8601 | $remote_addr | $request_id | '
                   '$request_method $uri | status=$status | '
                   'bytes=$body_bytes_sent | upstream=$upstream_addr | '
                   'upstream_status=$upstream_status | rt=$request_time | '
                   '"$http_user_agent"';

# Общий набор проксирующих заголовков (для backend-локаций).
# nginx не поддерживает include-переменные — дублируем в каждой location.

server {
    listen 80;
    listen [::]:80;

    # Компания определяется поддоменом: kz.example.kz -> компания "kz".
    # Именованная группа $company попадает в заголовок, который читает
    # htqweb.middleware.company_context.CompanyContextMiddleware.
    #
    # Регулярка ловит ТОЛЬКО хосты вида "<company>.<root>", где:
    #   - <company> начинается с буквы (первый символ [a-z]) — этим отсечены
    #     IP-адреса (первая метка "192" начинается с цифры и не пройдёт);
    #   - <root> — либо буквально "localhost" (разработка на *.localhost,
    #     где резолвится в 127.0.0.1 без правки hosts), либо содержит СВОЮ
    #     точку, то есть минимум два уровня после компании (example.kz —
    #     не два уровня для company.root, а один: "example" тут не root, а
    #     сам company; ниже пример).
    #   - "www" как company явно исключён негативным lookahead'ом — самый
    #     частый зарезервированный поддомен.
    # Голый домен второго уровня (example.kz) и голый IP НЕ матчатся вовсе:
    # для example.kz единственная возможная разбивка — company="example",
    # root="kz", а "kz" не содержит точки и не равен "localhost", поэтому
    # вся регулярка проваливается, $company остаётся пустым, и запрос уходит
    # в public — это штатный режим общих доменов (users/cms/media) и
    # переходного периода, пока фронт не переведён на поддомены.
    # ⚠️ Известный пробел: зарезервирован только "www". Другие технические
    # поддомены (api, cdn, static и т.п.) регулярка НЕ исключает — они будут
    # приняты как company-slug, и если компании с таким именем нет, ответ
    # будет 404 "Компания не найдена", а не общий public-режим.
    server_name ~^(?!www\.)(?<company>[a-z][a-z0-9-]*)\.(?:localhost|[^.]+(?:\.[^.]+)+)$;

    client_max_body_size 10M;

    # Заголовок ставится ЖЁСТКО, затирая присланный клиентом: иначе любой
    # желающий выбирал бы себе компанию сам, отправив свой X-HTQ-Company.
    # ⚠️ nginx не наследует proxy_set_header в location, если внутри него
    # объявлен хотя бы один свой proxy_set_header — эта директива продублирована
    # ниже в каждом таком блоке, проксирующем на backend/backend_asgi (Django).
    # SFU (/ws/sfu/) и Grafana (/grafana/) — не Django и этот заголовок не
    # читают, поэтому туда он не дублируется.
    proxy_set_header X-HTQ-Company $company;

    access_log /var/log/nginx/gateway_access.log gateway;
    error_log  /var/log/nginx/gateway_error.log warn;

    # ─── Let's Encrypt ACME ─────────────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript application/xml application/xml+rss
               image/svg+xml font/woff font/woff2;
    gzip_static on;
    brotli on;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript image/svg+xml;
    etag on;

    add_header X-Gateway "htqweb" always;
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Метрики шлюза для nginx-prometheus-exporter ────────────────────────
    # Наружу не отдаётся: `internal` запрещает внешние запросы, доступ
    # остаётся только у соседей по docker-сети (экспортер ходит сюда сам).
    # stub_status — единственный источник RPS и состояния соединений на
    # шлюзе; из логов через Loki это восстанавливается лишь приблизительно.
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # сети docker-compose по умолчанию
        allow 192.168.0.0/16;
        deny all;
    }

    # ─── Liveness / Readiness ───────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"ok","gateway":"nginx"}';
        add_header Content-Type application/json;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://backend/api/core/v1/services/;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }
    location @backend_down {
        internal;
        return 503 '{"status":"degraded","gateway":"nginx","upstream":"backend"}';
        add_header Content-Type application/json;
    }

    # ─── Совместимость: старые бандлы фронта (rewrite → канонический /api/*) ─
    location ~ ^/api/token(/.*)?$ { rewrite ^/api/token(/.*)?$ /api/users/v1/token$1 last; }
    location ~ ^/api/register(/.*)?$ { rewrite ^/api/register(/.*)?$ /api/users/v1/register$1 last; }
    location ~ ^/api/pending-registrations(/.*)?$ { rewrite ^/api/pending-registrations(/.*)?$ /api/users/v1/pending-registrations$1 last; }
    location ~ ^/api/v1/profile(/.*)?$ { rewrite ^/api/v1/profile(/.*)?$ /api/users/v1/profile$1 last; }
    location ~ ^/api/v1/admin/users(/.*)?$ { rewrite ^/api/v1/admin/users(/.*)?$ /api/users/v1/admin/users$1 last; }
    location ~ ^/api/users/(?!v1(?:/|$))(.*)$ { rewrite ^/api/users/(.*)$ /api/users/v1/$1 last; }
    location ~ ^/api/news(/.*)?$ { rewrite ^/api/news(/.*)?$ /api/cms/v1/news$1 last; }
    location ~ ^/api/contact-requests(/.*)?$ { rewrite ^/api/contact-requests(/.*)?$ /api/cms/v1/contact-requests$1 last; }
    location ~ ^/api/v1/contact-requests(/.*)?$ { rewrite ^/api/v1/contact-requests(/.*)?$ /api/cms/v1/contact-requests$1 last; }
    location ~ ^/api/calendar-events(/.*)?$ { rewrite ^/api/calendar-events(/.*)?$ /api/tasks/v1/calendar$1 last; }
    location ~ ^/api/calendar-timeline(/.*)?$ { rewrite ^/api/calendar-timeline(/.*)?$ /api/tasks/v1/calendar/timeline$1 last; }
    location ~ ^/api/hr/(?!v1(?:/|$))(.*)$ { rewrite ^/api/hr/(.*)$ /api/hr/v1/$1 last; }
    location ~ ^/api/tasks/(?!v1(?:/|$))(.*)$ { rewrite ^/api/tasks/(.*)$ /api/tasks/v1/$1 last; }
    location ~ ^/api/cms/(?!v1(?:/|$))(.*)$ { rewrite ^/api/cms/(.*)$ /api/cms/v1/$1 last; }
    location ~ ^/api/email/(?!v1(?:/|$))(.*)$ { rewrite ^/api/email/(.*)$ /api/email/v1/$1 last; }
    location ~ ^/api/messenger/(?!v1(?:/|$))(.*)$ { rewrite ^/api/messenger/(.*)$ /api/messenger/v1/$1 last; }
    location ~ ^/api/media/v1/(?!files(?:/|$))(.*)$ { rewrite ^/api/media/v1/(.*)$ /api/media/v1/files/$1 last; }
    location ~ ^/api/media/(?!v1(?:/|$))(.*)$ { rewrite ^/api/media/(.*)$ /api/media/v1/files/$1 last; }

    location /media/ {
        default_type application/json;
        return 410 '{"error":"Legacy media path removed","use":"/api/media/v1/files/"}';
    }

    # ─── Frontend (Vite build) ──────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        location ~* \.html$ { add_header Cache-Control "no-cache"; }
    }
    location /assets/ { root /usr/share/nginx/html; expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location /fonts/  { root /usr/share/nginx/html; expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location ~* ^/(images|logos)/ { root /usr/share/nginx/html; expires 30d; add_header Cache-Control "public"; access_log off; }
    location /locales/ { root /usr/share/nginx/html; expires 1h; add_header Cache-Control "public"; access_log off; }

    # ─── SSE: поток одобрений (ДО общего /api/) — на ASGI, буферизация off ──
    location = /api/requests/v1/stream {
        proxy_pass http://backend_asgi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-HTQ-Company $company;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── Auth: выдача/обновление токена + регистрация (жёсткий anti-brute лимит)
    # exact-match (=) имеют высший приоритет → перехватывают у общего /api/.
    # APPEND_SLASH=False → оба написания. burst=2: короткий всплеск (login+refresh).
    location = /api/users/v1/token/         { limit_req zone=api_auth burst=2 nodelay; proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; proxy_set_header X-HTQ-Company $company; proxy_read_timeout 15s; }
    location = /api/users/v1/token          { limit_req zone=api_auth burst=2 nodelay; proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; proxy_set_header X-HTQ-Company $company; proxy_read_timeout 15s; }
    location = /api/users/v1/token/refresh/ { limit_req zone=api_auth burst=2 nodelay; proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; proxy_set_header X-HTQ-Company $company; proxy_read_timeout 15s; }
    location = /api/users/v1/token/refresh  { limit_req zone=api_auth burst=2 nodelay; proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; proxy_set_header X-HTQ-Company $company; proxy_read_timeout 15s; }
    location = /api/users/v1/register/      { limit_req zone=api_auth burst=2 nodelay; proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; proxy_set_header X-HTQ-Company $company; proxy_read_timeout 15s; }
    location = /api/users/v1/register       { limit_req zone=api_auth burst=2 nodelay; proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; proxy_set_header X-HTQ-Company $company; proxy_read_timeout 15s; }

    # ─── HR публичный API (строгий лимит, без auth) ─────────────────────────
    location /api/hr/v1/public/ {
        limit_req zone=api_public burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-HTQ-Company $company;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # ─── Email push-приёмники (Gmail Pub/Sub, Graph) — без rate-limit ───────
    location /api/email/v1/webhooks/ {
        client_max_body_size 256k;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-HTQ-Company $company;
        proxy_read_timeout 10s;
    }

    # ─── Медиа: загрузка (жёсткий лимит, буфер off) ─────────────────────────
    location = /api/media/v1/files/ {
        client_max_body_size 100M;
        limit_req zone=media_upload burst=10 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-HTQ-Company $company;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_request_buffering off;
    }

    # ─── Медиа: чтение/метаданные (+edge-кэш публичных вариантов) ───────────
    location /api/media/ {
        client_max_body_size 100M;
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-HTQ-Company $company;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_request_buffering off;
        proxy_cache media_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 206 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie;
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ─── Весь остальной API → Django (WSGI) ─────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-HTQ-Company $company;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ─── WebSocket — SFU-сигналинг ──────────────────────────────────────────
    # Авторизацию проверяет сам SFU (платформенный JWT на upgrade), nginx
    # только пробрасывает заголовки — в т.ч. Sec-WebSocket-Protocol, которым
    # браузер передаёт токен.
    #
    # QUIC-вариант того же сигналинга (контейнер webtransport, UDP :4433)
    # через nginx НЕ ходит: браузер открывает WebTransport-сессию прямо на
    # порт. Его надо открыть в файрволе и выдать ему сертификат домена.
    location /ws/sfu/ {
        limit_req zone=websocket burst=5 nodelay;
        proxy_pass http://sfu:4443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── WebSocket — Messenger (socket.io) → ASGI ───────────────────────────
    location /ws/ {
        limit_req zone=websocket burst=20 nodelay;
        proxy_pass http://backend_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # backend_asgi — тот же Django-процесс, что и WSGI (см. asgi.py),
        # поэтому заголовок пробрасываем и сюда — на случай не-Socket.IO
        # путей под /ws/. Само messenger'ское Socket.IO перехватывает
        # запрос раньше django_asgi_app и CompanyContextMiddleware его не
        # видит (см. htqweb/middleware/company_context.py) — контекст
        # компании для WS остаётся отдельной, ещё не решённой задачей.
        proxy_set_header X-HTQ-Company $company;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Django-admin + собранная статика (WhiteNoise/collectstatic) ────────
    location /django-admin/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-HTQ-Company $company;
        proxy_read_timeout 30s;
    }
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-HTQ-Company $company;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── Наблюдаемость ──────────────────────────────────────────────────────
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSO: платформенный JWT из cookie htq_access → X-JWT-Assertion
        proxy_set_header X-JWT-Assertion $cookie_htq_access;
        proxy_read_timeout 90s;
    }
    # /prometheus/ наружу НЕ отдаётся. Раньше он проксировался сюда без
    # какой-либо авторизации, а своей у Prometheus нет вовсе: любой
    # желающий получал полный список таргетов, внутренние адреса и все
    # метрики. Смотреть данные Prometheus можно через Grafana выше — там
    # datasource уже провижинится, а вход закрыт платформенным JWT.
}
