# ═══════════════════════════════════════════════════════════════════════════
# HTQWeb API Gateway (Nginx) — Production with HTTPS
# ═══════════════════════════════════════════════════════════════════════════
#
# Architecture:
#   React SPA -> Nginx (Gateway) -> FastAPI microservices
#
# HTTPS setup:
#   1. Start with HTTP only (certbot needs port 80 for ACME challenge)
#   2. Run: docker compose run --rm certbot certonly --webroot \
#        -w /var/www/certbot -d your-domain.com --email you@email.com --agree-tos
#   3. Uncomment the HTTPS server block below
#   4. docker compose restart nginx
#
# ═══════════════════════════════════════════════════════════════════════════

# ─── Upstream definitions ────────────────────────────────────────────────────

upstream user_service {
    server user-service:8005;
    keepalive 16;
}

upstream tasks_service {
    server task-service:8007;
    keepalive 16;
}

upstream requests_service {
    server requests-service:8013;
    keepalive 16;
}

upstream hr_service {
    server hr-service:8006;
    keepalive 16;
}

upstream messenger_service {
    server messenger-service:8008;
    keepalive 16;
}

upstream media_service {
    server media-service:8009;
    keepalive 16;
}

upstream email_service {
    server email-service:8010;
    keepalive 16;
}

upstream cms_service {
    server cms-service:8011;
    keepalive 16;
}

upstream admin_service {
    server admin-service:8012;
    keepalive 16;
}

upstream adminjs_panel {
    server adminjs-panel:3300;
    keepalive 16;
}

upstream prometheus {
    server prometheus:9090;
    keepalive 16;
}

upstream grafana {
    server grafana:3000;
    keepalive 16;
}

# ─── Rate limiting zones ────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=websocket:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_public:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=media_upload:10m rate=5r/s;

# ─── Cache zone for public media variants (thumbnails / previews) ───────────
proxy_cache_path /var/cache/nginx/media keys_zone=media_cache:10m
                 max_size=2g inactive=7d use_temp_path=off;

# ─── Custom log format for observability ────────────────────────────────────
log_format gateway '$time_iso8601 | '
                   '$remote_addr | '
                   '$request_id | '
                   '$request_method $uri | '
                   'status=$status | '
                   'bytes=$body_bytes_sent | '
                   'upstream=$upstream_addr | '
                   'upstream_status=$upstream_status | '
                   'response_time=$request_time | '
                   '"$http_user_agent"';

# ═══════════════════════════════════════════════════════════════════════════
# HTTP Server (port 80)
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10M;

    access_log /var/log/nginx/gateway_access.log gateway;
    error_log  /var/log/nginx/gateway_error.log warn;

    # ─── Let's Encrypt ACME challenge ───────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ─── Health check (always on HTTP for Docker/LB) ────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok","gateway":"nginx","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # ─── Redirect all other traffic to HTTPS (uncomment after getting cert) ─
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # ─── Below: HTTP fallback (remove after enabling HTTPS redirect) ────────

    # Efficient file transfer
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    gzip_static on;
    brotli on;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    etag on;

    # Security headers
    add_header X-Gateway "htqweb" always;
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness check — returns 200 as long as nginx itself is serving
    location = /health {
        access_log off;
        return 200 '{"status":"ok","gateway":"nginx"}';
        add_header Content-Type application/json;
    }

    # Readiness check — returns 200 once user-service (identity authority) is healthy
    location /health/ready {
        access_log off;
        proxy_pass http://user_service/health/;
        proxy_intercept_errors on;
        error_page 502 503 504 = @user_service_down;
    }

    location @user_service_down {
        internal;
        return 503 '{"status":"degraded","gateway":"nginx","upstream":"user_service","error":"unreachable"}';
        add_header Content-Type application/json;
    }

    # Temporary API aliases for cached old frontend bundles. Rewrites restart
    # location matching so the canonical service locations below handle proxying.
    location ~ ^/api/token(/.*)?$ {
        rewrite ^/api/token(/.*)?$ /api/users/v1/token$1 last;
    }

    location ~ ^/api/register(/.*)?$ {
        rewrite ^/api/register(/.*)?$ /api/users/v1/register$1 last;
    }

    location ~ ^/api/pending-registrations(/.*)?$ {
        rewrite ^/api/pending-registrations(/.*)?$ /api/users/v1/pending-registrations$1 last;
    }

    location ~ ^/api/v1/profile(/.*)?$ {
        rewrite ^/api/v1/profile(/.*)?$ /api/users/v1/profile$1 last;
    }

    location ~ ^/api/v1/admin/users(/.*)?$ {
        rewrite ^/api/v1/admin/users(/.*)?$ /api/users/v1/admin/users$1 last;
    }

    location ~ ^/api/items(/.*)?$ {
        rewrite ^/api/items(/.*)?$ /api/users/v1/items$1 last;
    }

    location ~ ^/api/users/(?!v1(?:/|$))(.*)$ {
        rewrite ^/api/users/(.*)$ /api/users/v1/$1 last;
    }

    location ~ ^/api/news(/.*)?$ {
        rewrite ^/api/news(/.*)?$ /api/cms/v1/news$1 last;
    }

    location ~ ^/api/contact-requests(/.*)?$ {
        rewrite ^/api/contact-requests(/.*)?$ /api/cms/v1/contact-requests$1 last;
    }

    location ~ ^/api/v1/contact-requests(/.*)?$ {
        rewrite ^/api/v1/contact-requests(/.*)?$ /api/cms/v1/contact-requests$1 last;
    }

    location ~ ^/api/calendar-events(/.*)?$ {
        rewrite ^/api/calendar-events(/.*)?$ /api/tasks/v1/calendar$1 last;
    }

    location ~ ^/api/calendar-timeline(/.*)?$ {
        rewrite ^/api/calendar-timeline(/.*)?$ /api/tasks/v1/calendar/timeline$1 last;
    }

    location ~ ^/api/hr/(?!v1(?:/|$))(.*)$ {
        rewrite ^/api/hr/(.*)$ /api/hr/v1/$1 last;
    }

    location ~ ^/api/tasks/(?!v1(?:/|$))(.*)$ {
        rewrite ^/api/tasks/(.*)$ /api/tasks/v1/$1 last;
    }

    location ~ ^/api/cms/(?!v1(?:/|$))(.*)$ {
        rewrite ^/api/cms/(.*)$ /api/cms/v1/$1 last;
    }

    location ~ ^/api/email/(?!v1(?:/|$))(.*)$ {
        rewrite ^/api/email/(.*)$ /api/email/v1/$1 last;
    }

    location ~ ^/api/messenger/(?!v1(?:/|$))(.*)$ {
        rewrite ^/api/messenger/(.*)$ /api/messenger/v1/$1 last;
    }

    location ~ ^/api/media/v1/(?!files(?:/|$))(.*)$ {
        rewrite ^/api/media/v1/(.*)$ /api/media/v1/files/$1 last;
    }

    location ~ ^/api/media/(?!v1(?:/|$))(.*)$ {
        rewrite ^/api/media/(.*)$ /api/media/v1/files/$1 last;
    }

    location /media/ {
        default_type application/json;
        return 410 '{"error":"Legacy media path removed","gateway":"nginx","use":"/api/media/v1/files/"}';
    }

    # ─── Frontend (Vite build) ──────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /fonts/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* ^/(images|logos)/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /locales/ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    # ─── Tasks API → Tasks Service ─────────────────────────────────────────
    location /api/tasks/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://tasks_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ─── Requests SSE stream (must precede /api/requests/) ────────────────
    # Long-lived event stream — disable proxy buffering so chunks reach the
    # client immediately; bump read timeout well past the heartbeat interval.
    location = /api/requests/v1/stream {
        proxy_pass http://requests_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── Requests API → Requests Service ───────────────────────────────────
    location /api/requests/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://requests_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ─── HR Public API (stricter rate limit, no auth) ──────────────────────
    location /api/hr/v1/public/ {
        limit_req zone=api_public burst=5 nodelay;
        proxy_pass http://hr_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    10s;
        proxy_connect_timeout  5s;
    }

    # ─── HR API → HR Service ───────────────────────────────────────────────
    location /api/hr/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://hr_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ─── User Service (all endpoints live under /api/users/v1/*) ────────────
    location /api/users/v1/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    15s;
        proxy_connect_timeout  5s;
    }

    # ─── Messenger API ──────────────────────────────────────────────────────
    location /api/messenger/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://messenger_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
    }

    # ─── Media API ──────────────────────────────────────────────────────────
    # Per-location body limit lets uploads use the full ``MAX_UPLOAD_SIZE_MB``
    # without raising the global cap (which protects every other endpoint
    # from oversized payloads).
    location /api/media/ {
        client_max_body_size 100M;

        # Default rate-limit for media GETs / metadata calls. Uploads are
        # caught by the more specific ``location = /api/media/v1/files/``
        # below, which uses the upload-only zone.
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://media_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout     90s;
        proxy_send_timeout     90s;
        proxy_connect_timeout  5s;
        proxy_request_buffering off;

        # Cache GETs of public files at the edge — variants are content-
        # addressed by uuid so the URL is effectively immutable. The media
        # service still controls invalidation by deleting the variant.
        proxy_cache              media_cache;
        proxy_cache_methods      GET HEAD;
        proxy_cache_valid        200 206 7d;
        proxy_cache_valid        404      1m;
        proxy_cache_key          "$scheme$proxy_host$request_uri";
        proxy_cache_use_stale    error timeout updating;
        proxy_ignore_headers     Set-Cookie;
        proxy_no_cache           $http_authorization;  # never cache auth-bearing requests
        proxy_cache_bypass       $http_authorization;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Tighter rate-limit applied only to the upload endpoint.
    location = /api/media/v1/files/ {
        client_max_body_size 100M;
        limit_req zone=media_upload burst=10 nodelay;

        proxy_pass http://media_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout     90s;
        proxy_send_timeout     90s;
        proxy_connect_timeout  5s;
        proxy_request_buffering off;
    }

    # ─── CMS API ────────────────────────────────────────────────────────────
    location /api/cms/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://cms_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
    }

    # ─── WebSocket — SFU signaling ──────────────────────────────────────────
    location /ws/sfu/ {
        limit_req zone=websocket burst=5 nodelay;
        proxy_pass http://sfu:4443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── WebSocket — Messenger / general ────────────────────────────────────
    location /ws/ {
        limit_req zone=websocket burst=20 nodelay;
        proxy_pass http://messenger_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Email push receivers → Email Service (NO rate limit) ───────────────
    # Gmail Pub/Sub and Microsoft Graph deliver bursts; rate-limiting them
    # would silently drop notifications. Validation happens at the app layer
    # (Bearer JWT for Gmail, clientState for Graph).
    location /api/email/v1/webhooks/ {
        client_max_body_size 256k;
        proxy_pass http://email_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    10s;
        proxy_connect_timeout  5s;
    }

    # ─── Email API → Email Service ──────────────────────────────────────────
    location /api/email/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://email_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
    }

    # ─── Admin API → Admin Aggregator ──────────────────────────────────────
    location /api/admin/ {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    15s;
        proxy_connect_timeout  5s;
    }

    # ─── Unknown /api/ → 404 (Django removed; unknown prefix is a client bug)
    location /api/ {
        default_type application/json;
        return 404 '{"error":"Unknown API prefix","gateway":"nginx"}';
    }

    # ─── Database admin (sqladmin aggregator) ───────────────────────────────
    # Mounted at /sqladmin/ to avoid colliding with the React SPA's own
    # /admin/users, /admin/chats, /admin/registrations routes.
    location /sqladmin/ {
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
    }

    # ─── MongoDB/AdminJS panel ─────────────────────────────────────────────
    location = /mongo-admin {
        return 301 /mongo-admin/;
    }

    location /mongo-admin/ {
        proxy_pass http://adminjs_panel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
    }

    # ─── Monitoring (Grafana + Prometheus) ─────────────────────────────────
    location /grafana/ {
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSO: the frontend stores the platform JWT in the `htq_access`
        # cookie (path=/grafana); Grafana's [auth.jwt] validates it from the
        # X-JWT-Assertion header on every request (Vite does the same in dev).
        proxy_set_header X-JWT-Assertion $cookie_htq_access;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location /prometheus/ {
        proxy_pass http://prometheus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
    }

    location = /prometheus {
        return 301 /prometheus/;
    }

    # ─── Static files ───────────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ``/media/`` was the legacy Django MEDIA_URL alias. The active guard
    # above returns JSON 410 so stale pages do not receive SPA HTML.
}

# ═══════════════════════════════════════════════════════════════════════════
# HTTPS Server (port 443) — Uncomment after obtaining Let's Encrypt certificate
# ═══════════════════════════════════════════════════════════════════════════
# To enable:
#   1. Run: docker compose run --rm certbot certonly --webroot \
#        -w /var/www/certbot -d YOUR_DOMAIN --email YOUR_EMAIL --agree-tos
