# nginx проверочной сборки: раздаёт собранный React-SPA и проксирует ВЕСЬ
# /api/ и /ws/ в ЕДИНЫЙ Django-backend (в отличие от dev-vite, который
# расщеплял /api/<service> по разным FastAPI-контейнерам).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;   # загрузки медиа (MAX_UPLOAD_SIZE_MB=100)

    # API + служебные core-роуты (health, /api/core/v1/services/) — в Django.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket-трафик (messenger socket.io / sfu) — тоже в Django. Пока
    # соответствующие домены не перенесены, отдаёт 404, это ожидаемо.
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Django-админка и её статика (в DEBUG runserver отдаёт CSS сам).
    location /django-admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }

    # SPA client-side routing: всё остальное — на index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
