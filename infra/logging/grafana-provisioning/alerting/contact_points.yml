# Grafana alerting — точки доставки и политика маршрутизации (provisioned).
#
# Раньше здесь стояла заглушка: email на oncall@htqweb.local при
# ненастроенном SMTP, то есть уведомления не уходили НИКУДА, а алерты жили
# только на экране, куда во время аварии никто не смотрит.
#
# Теперь три точки доставки и ДВА РАЗНЫХ ЧАТА:
#   • htqweb-telegram — инциденты. Звонит. Сюда идёт всё, у чего нет лейбла
#     channel=business. Доходит мгновенно и не зависит от почты, которая
#     работает на этой же платформе и в момент аварии может лежать сама.
#   • htqweb-telegram-business — бизнес-события (channel=business). Молчит,
#     копится, повторяется раз в сутки. Отдельный чат потому, что «обращение
#     с сайта висит сутки» рядом с «Postgres не отвечает» обесценивает оба.
#   • htqweb-email — дополнительно и ТОЛЬКО на critical, как второй
#     независимый путь на случай, когда недоступен Telegram.
#
# Тексты сообщений — в templates.yml (свой шаблон на каждый чат).
#
# Секреты берутся из окружения Grafana (см. .env.example):
#   GF_TELEGRAM_BOT_TOKEN — бот, ОБЩИЙ для обоих чатов (id чатов — литералы
#     ниже, и там написано, почему их нельзя брать из окружения);
#   GF_SMTP_* — почтовый сервер (без них email-канал молча не отправляет).
# Синтаксис $__env{...} — штатная подстановка окружения в провижининге
# Grafana; класть токен бота в репозиторий нельзя.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: htqweb-telegram
    receivers:
      - uid: htqweb-telegram-receiver
        type: telegram
        settings:
          # Токен — секрет, поэтому только из окружения.
          bottoken: $__env{GF_TELEGRAM_BOT_TOKEN}
          #
          # А вот chat id ниже лежит в репозитории ОТКРЫТО, и это осознанно.
          # Он не учётные данные: постить в группу может только бот, который в
          # ней состоит, и только со своим токеном; читать её по id нельзя
          # вовсе. Знание id без токена не даёт ничего.
          #
          # Спрятать его всё равно не выйдет дёшево: $__env{} для chatid
          # роняет Grafana (см. развёрнутое объяснение ниже), а обходной путь —
          # копировать provisioning в /tmp и подставлять на старте, потому что
          # каталог примонтирован :ro. Это добавило бы точку отказа сервису,
          # чьё падение оставляет платформу без дашбордов И без алертов сразу.
          # Цена не стоит сокрытия несекрета.
          # ⚠️ Chat id задаётся ЗДЕСЬ ЛИТЕРАЛОМ, а не через $__env{}, и это
          # не небрежность. Grafana 10.4 переопределяет тип значения ПОСЛЕ
          # подстановки окружения, поэтому числовой id (а Telegram выдаёт
          # именно числовой, у групп ещё и отрицательный) приезжает в
          # настройки как JSON-число и старт падает целиком:
          #   «cannot unmarshal number into Go struct field Config.chatid
          #    of type string».
          # Ни кавычки, ни тег !!str этого не лечат — проверено. Литерал в
          # кавычках подстановку не проходит и остаётся строкой.
          # Chat id не секрет (секрет — токен выше), так что держать его в
          # конфиге допустимо. Узнать свой: @userinfobot для личного чата;
          # для группы — добавить в неё бота и взять id из
          # https://api.telegram.org/bot<ТОКЕН>/getUpdates (он отрицательный).
          #
          # Здесь — групповой чат «чат ALERT», инциденты.
          #
          # ⚠️ Если группу когда-нибудь повысят до супергруппы (Telegram делает
          # это сам — при подключении истории для новых участников, добавлении
          # админов и т.п.), её id СМЕНИТСЯ на вид -100…, и доставка тихо
          # прекратится: Grafana продолжит слать, Telegram — отвечать
          # "chat not found", в интерфейсе всё будет выглядеть исправным.
          # Симптом «алерты перестали приходить, хотя ничего не меняли» — это
          # первое, что нужно проверить.
          chatid: "-5207523821"
          # Текст переехал в templates.yml: у двух чатов разные шаблоны, и
          # копия инлайном разъехалась бы на первой правке. Там же объяснено,
          # почему порог печатается из аннотации, а не из данных алерта.
          message: '{{ template "htqweb.incident" . }}'
          # Звук включён: этот чат для того и существует, чтобы будить.
          disable_notification: false
        disableResolveMessage: false

  # ── Второй чат: бизнес-события ────────────────────────────────────────────
  # Отдельный ресивер, а не второй маршрут на тот же, потому что у бизнес-
  # уведомлений другой ДОГОВОР с читателем:
  #   • они приходят молча (disable_notification) — их читают, когда сядут за
  #     стол, а не когда зазвонит телефон;
  #   • им РАЗРЕШЕНО гореть неделями. «Три оплаты ждут бухгалтерию» — это
  #     состояние компании, а не авария. В инцидентном чате постоянно горящее
  #     правило обесценивает канал целиком (см. шапку rules.yml); здесь это
  #     ровно то, что нужно — счётчик незакрытых дел.
  # Разводит их лейбл channel=business, а НЕ severity: severity описывает
  # СРОЧНОСТЬ, channel — АДРЕСАТА, и смешивать эти оси нельзя.
  - orgId: 1
    name: htqweb-telegram-business
    receivers:
      - uid: htqweb-telegram-business-receiver
        type: telegram
        settings:
          # Тот же бот: заводить второго незачем, достаточно добавить его во
          # вторую группу.
          bottoken: $__env{GF_TELEGRAM_BOT_TOKEN}
          # ⚠️ Литералом и В КАВЫЧКАХ — по той же причине, что у чата выше
          # (см. развёрнутое объяснение там): числовой id роняет старт Grafana.
          # Группа «второй тест ALERT(других)».
          chatid: "-5440334455"
          message: '{{ template "htqweb.business" . }}'
          # Молча: телефон не звонит, сообщение просто лежит и ждёт.
          disable_notification: true
        # Resolve здесь ОСМЫСЛЕН, в отличие от инцидентов: «обращение
        # обработано» — хорошая новость, ради которой стоит потратить
        # сообщение.
        disableResolveMessage: false

  - orgId: 1
    name: htqweb-email
    receivers:
      - uid: htqweb-email-receiver
        type: email
        settings:
          addresses: $__env{ALERT_EMAIL_TO}
          singleEmail: false
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: htqweb-telegram
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      # ⚠️ ПОРЯДОК ЗДЕСЬ — ЭТО ЛОГИКА, А НЕ ОФОРМЛЕНИЕ.
      # Маршруты просматриваются сверху вниз, и первый совпавший БЕЗ
      # continue поглощает алерт. Бизнес-маршрут стоит ПЕРВЫМ и БЕЗ
      # continue — именно это гарантирует, что бизнес-событие не окажется
      # заодно в инцидентном чате, а если кто-то однажды поставит бизнес-
      # правилу severity=critical — ещё и на почте дежурного. Переставить
      # его вниз значит тихо сломать разведение по чатам.
      - receiver: htqweb-telegram-business
        matchers:
          - channel = business
        # Своя группировка: бизнес-события копятся, а не будят. Пять минут на
        # сборку пачки, полчаса между пачками, сутки до повтора — то есть
        # вечно горящее «три оплаты ждут бухгалтерию» напомнит о себе раз в
        # день, а не каждые 12 часов, как инцидент.
        group_by: [grafana_folder, alertname]
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 24h

      # critical дублируется на почту вторым независимым каналом.
      # continue: true обязателен — без него маршрут поглотил бы алерт и в
      # Telegram он бы не ушёл.
      - receiver: htqweb-email
        matchers:
          - severity = critical
        group_wait: 0s
        repeat_interval: 1h
        continue: true
      - receiver: htqweb-telegram
        matchers:
          - severity = critical
        group_wait: 0s
        repeat_interval: 1h
