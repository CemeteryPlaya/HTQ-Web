global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Попадает в каждую серию. Нужен, чтобы данные разных стендов не
    # смешивались, если их когда-нибудь сведут в одно хранилище.
    env: "${PROMETHEUS_ENV}"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app_name: "prometheus"

  # ─── Django backend ────────────────────────────────────────────
  # Два процесса одного кода, но разные рабочие нагрузки, и мерить их надо
  # порознь: WSGI держит весь /api/*, ASGI — SSE-поток и WebSocket'ы
  # мессенджера, у них принципиально разная форма латентности.
  #
  # backend-web бежит под gunicorn --workers 4, поэтому метрики собираются
  # в мультипроцессном режиме (PROMETHEUS_MULTIPROC_DIR + htqweb/
  # gunicorn_conf.py) — иначе скрейп попадал бы в случайный воркер.
  - job_name: "django-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-web:8000"]
        labels: { app_name: "django-backend", process: "wsgi" }

  - job_name: "django-asgi"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-asgi:8000"]
        labels: { app_name: "django-backend", process: "asgi" }

  # ─── Celery ────────────────────────────────────────────────────
  # Через уже стоящий Flower: с версии 1.0 он сам отдаёт /metrics, поэтому
  # отдельный celery-exporter не нужен. Требует событий задач — их включает
  # CELERY_WORKER_SEND_TASK_EVENTS в htqweb/settings/base.py (настройкой, а не
  # флагом `-E` у воркера: флаг пришлось бы повторять в трёх compose-файлах, и
  # забытая копия ломается молча). Без событий Flower видит только самого
  # воркера, но не то, что он выполняет.
  #
  # Длина очереди приходит НЕ отсюда, а от redis-exporter'а
  # (REDIS_EXPORTER_CHECK_KEYS → redis_key_size): Flower её не знает. Номер БД
  # там 2, а не 9 — CELERY_BROKER_URL в compose перекрывает дефолт из settings.
  - job_name: "celery"
    static_configs:
      - targets: ["flower:5555"]
        labels: { component: "celery" }

  # ─── Database Exporters ────────────────────────────────────────
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { component: "postgres" }

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { component: "redis" }

  # ─── Хост и контейнеры ─────────────────────────────────────────
  # Ради диска в первую очередь: «кончилось место» роняет прод чаще всего,
  # а никакой другой таргет этого не видит.
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { component: "host" }

  - job_name: "cadvisor"
    # 30 с, а не глобальные 15: housekeeping_interval у самого cAdvisor тоже
    # 30 с (см. его команду в compose), так что вдвое частый скрейп отдавал бы
    # те же цифры и вдвое увеличивал хранение на самом многосерийном таргете.
    scrape_interval: 30s
    # На холодном старте и при десятке контейнеров cAdvisor отвечает дольше
    # дефолтных 10 с — и таргет разом уходит в DOWN на ровном месте.
    scrape_timeout: 20s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: { component: "containers" }

  # ─── Шлюз ──────────────────────────────────────────────────────
  # dns_sd, а не static_configs, и это не украшательство. nginx-exporter живёт
  # в профиле production; в тестовых стеках его контейнера нет вовсе, и
  # статический таргет давал бы там вечный up==0 — то есть постоянно горящий
  # critical htqweb-target-down. Алерт, который горит всегда, не значит ничего.
  #
  # Встроенный DNS Docker не резолвит сервис без контейнера: у джоба ноль
  # таргетов, серии up нет, алертить не на что. Поднялся контейнер — таргет
  # появился сам. Подставить стенд-зависимый конфиг нечем: он вшит в образ, а
  # --enable-feature=expand-external-labels разворачивает ТОЛЬКО external_labels.
  #
  # Цена, принятая осознанно: вне прода Prometheus раз в 30 с пишет в свой лог
  # ошибку резолва (prometheus_sd_dns_lookup_failures_total). Шум в логе
  # контейнера дешевле вечного critical.
  - job_name: "nginx"
    dns_sd_configs:
      - names: ["nginx-exporter"]
        type: A
        port: 9113
        refresh_interval: 30s
    relabel_configs:
      # instance из DNS — это IP:порт, он меняется при каждом пересоздании
      # контейнера и рвал бы непрерывность графиков и группировку алертов.
      - target_label: instance
        replacement: "nginx-exporter:9113"
      - target_label: component
        replacement: "gateway"

  # ─── Конференция ───────────────────────────────────────────────
  # Экспорт живёт в самом SFU (sfu/src/metrics.ts): штатного /metrics у
  # mediasoup нет.
  - job_name: "sfu"
    static_configs:
      - targets: ["sfu:4443"]
        labels: { component: "sfu" }

  # ─── MinIO Built-in Metrics ────────────────────────────────────
  # Requires MINIO_PROMETHEUS_AUTH_TYPE=public on the minio container,
  # otherwise the endpoint answers 403.
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    # Самый медленный эндпоинт в стеке: /cluster обходит бакеты.
    scrape_timeout: 10s
    static_configs:
      - targets: ["minio:9000"]
        labels: { component: "minio" }

  # ─── Logging / observability stack itself ─────────────────────
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels: { component: "loki" }

  # serve_from_sub_path=true mounts everything (incl. /metrics) under /grafana.
  - job_name: "grafana"
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels: { component: "grafana" }

  # ─── Чего здесь нет намеренно ──────────────────────────────────
  # У backend-worker, backend-beat и backend-media-worker НЕТ и не должно быть
  # /metrics: это Celery-процессы, HTTP они не обслуживают, и добавить им
  # эндпоинт значило бы вкрутить в них веб-сервер. Их наблюдаемость по
  # построению косвенная, и её достаточно:
  #   • Flower — живы ли воркеры и что они выполняют (job "celery" выше);
  #   • redis_key_size по их очередям — берут ли вообще (job "redis");
  #   • Loki — их логи, включая строки FALLBACK (правило
  #     htqweb-fallback-worker-logs: подмены из задач в метрику не попадают
  #     именно потому, что /metrics у этих процессов нет);
  #   • htqweb_*-гейджи — результат их работы, виден через backend-web.
