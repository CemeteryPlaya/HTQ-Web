global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app_name: "prometheus"

  # ─── Django backend ────────────────────────────────────────────
  # Девять FastAPI-сервисов схлопнуты в единый Django-backend (миграция, фаза 11).
  # Раскомментировать, КОГДA у бэкенда появится /metrics: поставить
  # django-prometheus, добавить в INSTALLED_APPS + middleware (Prometheus{Before,
  # After}Middleware) и роут /metrics. До тех пор эндпойнта нет — не скрейпим,
  # чтобы не плодить down-таргеты.
  # - job_name: "django-backend"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["backend-web:8000"]
  #       labels: { app_name: "django-backend" }

  # ─── Database Exporters ────────────────────────────────────────
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { component: "postgres" }

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { component: "redis" }

  # ─── MinIO Built-in Metrics ────────────────────────────────────
  # Requires MINIO_PROMETHEUS_AUTH_TYPE=public on the minio container,
  # otherwise the endpoint answers 403.
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels: { component: "minio" }

  # ─── Logging / observability stack itself ─────────────────────
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels: { component: "loki" }

  # serve_from_sub_path=true mounts everything (incl. /metrics) under /grafana.
  - job_name: "grafana"
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels: { component: "grafana" }
