# ═══════════════════════════════════════════════════════════════════════════════
# HTQWeb — Development override (единый Django-backend)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Отличия от прод-стека:
#   - frontend: Vite dev-сервер с HMR на :3000 (вместо одноразовой сборки);
#     его прокси бьёт в ЕДИНЫЙ backend (/api → backend-web, /ws → backend-asgi).
#   - backend-*: DEBUG-настройки (htqweb.settings.dev), исходники смонтированы
#     как том (правки видны сразу), runserver/uvicorn --reload вместо gunicorn.
#   - nginx: выключен (в dev маршрутизацию делает Vite-прокси).
#   - MinIO: dev-инстанс + одноразовый bootstrap бакетов.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── nginx выключен в dev (маршрутизацию делает Vite) ───────────────────────
  nginx:
    profiles:
      - production-only

  # ─── Vite dev-сервер с HMR ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    entrypoint: []
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_DEV_HTTPS: "false"
      VITE_DISABLE_HMR: "false"
      # Единый Django-backend: /api → backend-web (WSGI), /ws → backend-asgi (ASGI).
      VITE_BACKEND_TARGET: "http://backend-web:8000"
      VITE_MESSENGER_WS_TARGET: "ws://backend-asgi:8000"
      VITE_SFU_WS_TARGET: "ws://sfu:4443"
    depends_on:
      backend-web:
        condition: service_healthy

  # ─── Django backend (dev): DEBUG + автоперезагрузка + монтирование исходников ─
  backend-web:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: htqweb.settings.dev
    volumes:
      - ./backend:/app

  backend-asgi:
    command: ["uvicorn", "htqweb.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DJANGO_SETTINGS_MODULE: htqweb.settings.dev
    volumes:
      - ./backend:/app

  backend-worker:
    command: ["celery", "-A", "htqweb", "worker", "-l", "info"]
    environment:
      DJANGO_SETTINGS_MODULE: htqweb.settings.dev
    volumes:
      - ./backend:/app

  backend-beat:
    environment:
      DJANGO_SETTINGS_MODULE: htqweb.settings.dev
    volumes:
      - ./backend:/app

  # ─── MinIO (dev) ────────────────────────────────────────────────────────────
  # Консоль: http://localhost:9001 (minioadmin / minioadmin). В проде — остановить
  # и указать S3_ENDPOINT в корневом .env на AWS S3 (или совместимое).
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Одноразовое создание бакетов (идемпотентно, mb --ignore-existing).
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@minio:9000
    entrypoint: >
      /bin/sh -c "
        set -e;
        for b in ${MEDIA_S3_BUCKET:-htqweb-media} ${MESSENGER_S3_BUCKET:-htqweb-messenger} ${CMS_S3_BUCKET:-htqweb-cms} ${CONFERENCES_S3_BUCKET:-htqweb-conferences} ${MAIL_ATTACHMENTS_S3_BUCKET:-htqweb-mail-attachments}; do
          mc mb --ignore-existing local/$$b;
        done;
        echo placeholder | mc pipe local/${MESSENGER_S3_BUCKET:-htqweb-messenger}/chats/.keep;
        echo placeholder | mc pipe local/${CMS_S3_BUCKET:-htqweb-cms}/news/.keep;
        echo placeholder | mc pipe local/${CONFERENCES_S3_BUCKET:-htqweb-conferences}/recordings/.keep;
        echo placeholder | mc pipe local/${MAIL_ATTACHMENTS_S3_BUCKET:-htqweb-mail-attachments}/inbound/.keep;
        echo bootstrap-done;
      "
    restart: "no"

volumes:
  minio_data:
