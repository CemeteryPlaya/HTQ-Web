# ═══════════════════════════════════════════════════════════════════════════════
# HTQWeb — Development override (единый Django-backend)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Отличия от прод-стека:
#   - frontend: Vite dev-сервер с HMR на :3000 (вместо одноразовой сборки);
#     его прокси бьёт в ЕДИНЫЙ backend (/api → backend-web, /ws → backend-asgi).
#   - backend-*: DEBUG-настройки (htqweb.settings.dev), исходники смонтированы
#     как том (правки видны сразу), runserver/uvicorn --reload вместо gunicorn.
#   - nginx: выключен (в dev маршрутизацию делает Vite-прокси).
#   - MinIO: dev-инстанс + одноразовый bootstrap бакетов.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── nginx выключен в dev (маршрутизацию делает Vite) ───────────────────────
  nginx:
    profiles:
      - production-only

  # ─── Vite dev-сервер с HMR ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        # Dockerfile.dev ничего не собирает (Vite поднимается в рантайме), но
        # аргумент приезжает из базового compose — выравниваем, чтобы
        # `docker compose config` не показывал dev-стенд «продакшеном».
        VITE_HTQ_ENV: development
    entrypoint: []
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_DEV_HTTPS: "false"
      VITE_DISABLE_HMR: "false"
      # Слежение за файлами опросом. Без него inotify внутри контейнера не
      # видит правок на смонтированном диске Windows: Vite молчит, HMR не
      # срабатывает, и браузер продолжает получать модуль, собранный при
      # старте. Выглядит как «правку не применили», а на деле она есть и на
      # диске, и в контейнере — лечилось только рестартом контейнера.
      VITE_USE_POLLING: "true"
      # Строгий режим подмен: fallback не подставляет значение, а кидает
      # FallbackNotAllowedError — Vite показывает оверлей с настоящей причиной.
      # Здесь это переменная контейнера, а не аргумент сборки: dev-сервер читает
      # окружение на лету (в проде значение вшивается в бандл, см. Dockerfile).
      VITE_HTQ_ENV: "development"
      VITE_FALLBACK_MODE: ${FALLBACK_MODE:-}
      # Единый Django-backend: /api → backend-web (WSGI), /ws → backend-asgi (ASGI).
      VITE_BACKEND_TARGET: "http://backend-web:8000"
      VITE_ASGI_TARGET: "http://backend-asgi:8000"   # SSE /api/requests/v1/stream
      VITE_MESSENGER_WS_TARGET: "ws://backend-asgi:8000"
      VITE_SFU_WS_TARGET: "ws://sfu:4443"
    depends_on:
      backend-web:
        condition: service_healthy

  # ─── Django backend (dev): DEBUG + автоперезагрузка + монтирование исходников ─
  backend-web:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: htqweb.settings.dev
      # Обязательно рядом с настройками: x-django-env в базовом compose уже
      # положил HTQ_ENV=production, и без этой строки dev-контейнер работал бы
      # в прод-режиме подмен, несмотря на settings.dev.
      HTQ_ENV: development
      # Адрес, по которому платформу видит браузер. Нужен для ссылок в
      # письмах и сообщениях: сам бэкенд его не знает — Vite-прокси ставит в
      # Host внутреннее имя контейнера (backend-web:8000), и приглашение с
      # таким хостом не открывается ни у кого.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # QUIC-мост опубликован на хост как UDP :4433. localhost — secure
      # context, поэтому WebTransport из http://localhost:3000 работает;
      # с LAN-адреса (http://192.168.x.y:3000) браузер его не даст —
      # это не наш баг, нужен HTTPS.
      # Форма `${VAR-default}` (без двоеточия) подставляет дефолт только когда
      # переменная НЕ ЗАДАНА. С `${VAR:-default}` пустое значение в .env тоже
      # заменялось бы дефолтом, и выключить WebTransport было бы нечем — а он
      # мешает, когда стенд открыт наружу: гость несколько секунд ждёт таймаут
      # QUIC на localhost своей же машины, прежде чем откатиться на WebSocket.
      CONFERENCE_WT_URL: ${CONFERENCE_WT_URL-https://localhost:4433/sfu}
    volumes:
      - ./backend:/app

  backend-asgi:
    command: ["uvicorn", "htqweb.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DJANGO_SETTINGS_MODULE: htqweb.settings.dev
      # Обязательно рядом с настройками: x-django-env в базовом compose уже
      # положил HTQ_ENV=production, и без этой строки dev-контейнер работал бы
      # в прод-режиме подмен, несмотря на settings.dev.
      HTQ_ENV: development
    volumes:
      - ./backend:/app

  backend-worker:
    command: ["celery", "-A", "htqweb", "worker", "-l", "info"]
    environment:
      DJANGO_SETTINGS_MODULE: htqweb.settings.dev
      # Обязательно рядом с настройками: x-django-env в базовом compose уже
      # положил HTQ_ENV=production, и без этой строки dev-контейнер работал бы
      # в прод-режиме подмен, несмотря на settings.dev.
      HTQ_ENV: development
    volumes:
      - ./backend:/app

  backend-media-worker:
    environment:
      DJANGO_SETTINGS_MODULE: htqweb.settings.dev
      # Обязательно рядом с настройками: x-django-env в базовом compose уже
      # положил HTQ_ENV=production, и без этой строки dev-контейнер работал бы
      # в прод-режиме подмен, несмотря на settings.dev.
      HTQ_ENV: development
      # У разработчика — самая лёгкая модель: medium на ноутбуке считает
      # получасовую встречу дольше, чем длилась сама встреча, и отладка
      # протокола превращается в ожидание. Точность здесь не проверяют.
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      - ./backend:/app
      - conference_raw:/recordings
      - whisper_models:/models

  backend-beat:
    environment:
      DJANGO_SETTINGS_MODULE: htqweb.settings.dev
      # Обязательно рядом с настройками: x-django-env в базовом compose уже
      # положил HTQ_ENV=production, и без этой строки dev-контейнер работал бы
      # в прод-режиме подмен, несмотря на settings.dev.
      HTQ_ENV: development
    volumes:
      - ./backend:/app

  # ─── SFU (dev) ──────────────────────────────────────────────────────────────
  # Сигналинг браузер видит как ws://localhost:3000/ws/sfu/ — Vite-прокси
  # (VITE_SFU_WS_TARGET выше) отправляет его в этот контейнер.
  #
  # WEBRTC_ANNOUNCED_IP=127.0.0.1 годится, пока браузер на той же машине:
  # порт 44444 опубликован на хост. Для проверки с телефона/второго ноутбука
  # поставьте LAN-IP хоста в корневом .env (WEBRTC_ANNOUNCED_IP=192.168.x.y),
  # иначе ICE-кандидаты будут указывать на loopback второго устройства.
  sfu:
    environment:
      WEBRTC_ANNOUNCED_IP: ${WEBRTC_ANNOUNCED_IP:-127.0.0.1}
      # Как и у backend-*: базовый compose уже положил production, перебиваем.
      HTQ_ENV: development

  # ─── MinIO (dev) ────────────────────────────────────────────────────────────
  # Консоль: http://localhost:9001 (minioadmin / minioadmin). В проде — остановить
  # и указать S3_ENDPOINT в корневом .env на AWS S3 (или совместимое).
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Одноразовое создание бакетов (идемпотентно, mb --ignore-existing).
  #
  # ВНИМАНИЕ: это подстраховка, а не единственный механизм. От этого job'а
  # никто не зависит через depends_on, поэтому точечный запуск
  # (`up -d backend-web`, `--no-deps`) его не поднимает — основную гарантию
  # даёт `manage.py ensure_buckets` в backend/docker-entrypoint.sh.
  #
  # Бакетов два — ровно по потребителям htqweb.storage.get_storage():
  # S3_BUCKET (снапшоты новостей cms + архив истории чатов) и MEDIA_S3_BUCKET
  # (ВСЕ бинарные файлы — после схлопывания в монолит каждая аппка пишет
  # через apps.media_files.interface.store_file()). Бакеты на сервис
  # (htqweb-messenger / htqweb-conferences / htqweb-mail-attachments) умерли
  # вместе с микросервисами — в backend/ они не упоминаются ни разу.
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@minio:9000
    entrypoint: >
      /bin/sh -c "
        set -e;
        for b in ${S3_BUCKET:-htqweb-cms} ${MEDIA_S3_BUCKET:-htqweb-media}; do
          mc mb --ignore-existing local/$$b;
        done;
        echo placeholder | mc pipe local/${S3_BUCKET:-htqweb-cms}/news/.keep;
        echo bootstrap-done;
      "
    restart: "no"

  # ─── Наблюдаемость: порты наружу ТОЛЬКО в dev ──────────────────────────
  #
  # В базовом compose (= прод) публикации нет намеренно. У Prometheus,
  # Loki и Flower своей аутентификации не существует вовсе: открытые
  # наружу, они отдают любому желающему внутреннюю топологию, содержимое
  # логов и имена задач. Наружу в проде смотрит только Grafana — и то через
  # nginx, где на /grafana/ уже стоит JWT SSO платформы.
  #
  # Локально всё это удобно дёргать напрямую (особенно :9090/prometheus/targets
  # при отладке скрейпа), поэтому порты возвращаются здесь.
  prometheus:
    ports:
      - "9090:9090"

  # Порт вынесен в переменную: 3001 — то, что по умолчанию ждёт Vite-прокси
  # (frontend/vite.config.ts, VITE_GRAFANA_TARGET), но на машине он бывает
  # занят соседним проектом. Тогда: GRAFANA_DEV_PORT=3011 в корневом .env И
  # VITE_GRAFANA_TARGET=http://127.0.0.1:3011 во frontend/.env — иначе
  # /grafana/ уедет в чужой контейнер.
  grafana:
    ports:
      - "${GRAFANA_DEV_PORT:-3001}:3000"

  loki:
    ports:
      - "3100:3100"

  flower:
    ports:
      - "5555:5555"
    # Flower поднимает то же Django-приложение (`celery -A htqweb`), поэтому и
    # настройки, и метку среды берёт те же, что backend-*.
    environment:
      DJANGO_SETTINGS_MODULE: htqweb.settings.dev
      HTQ_ENV: development

  postgres-exporter:
    ports:
      - "9187:9187"

  redis-exporter:
    ports:
      - "9121:9121"

  node-exporter:
    ports:
      - "9100:9100"

  cadvisor:
    ports:
      - "8081:8080"

volumes:
  minio_data:
