# ═══════════════════════════════════════════════════════════════════════════════
# HTQWeb — Development override
# ═══════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# What changes vs production:
#   - frontend: Vite dev server with HMR on :3000 (replaces one-shot build)
#   - All services: SERVICE_ENV=development (enables /docs, verbose logs)
#   - nginx: disabled in dev (Vite proxy handles routing to microservices)
#   - frontend source mounted as volume — changes reflect immediately
#
# The Vite proxy targets FastAPI services directly; no legacy backend
# container is part of the dev stack.
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── Turn off nginx in dev (Vite dev server handles proxy) ──────────────────
  nginx:
    profiles:
      - production-only

  # ─── Vite dev server with HMR ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    entrypoint: []
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_DEV_HTTPS: "false"
      VITE_DISABLE_HMR: "false"
      VITE_USER_SERVICE_TARGET: "http://user-service:8005"
      VITE_HR_SERVICE_TARGET: "http://hr-service:8006"
      VITE_TASKS_SERVICE_TARGET: "http://task-service:8007"
      VITE_MESSENGER_SERVICE_TARGET: "http://messenger-service:8008"
      VITE_MEDIA_SERVICE_TARGET: "http://media-service:8009"
      VITE_EMAIL_SERVICE_TARGET: "http://email-service:8010"
      VITE_CMS_SERVICE_TARGET: "http://cms-service:8011"
      VITE_ADMIN_SERVICE_TARGET: "http://admin-service:8012"
      VITE_MESSENGER_WS_TARGET: "ws://messenger-service:8008"
      VITE_SFU_WS_TARGET: "ws://sfu:4443"
    depends_on:
      user-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      task-service:
        condition: service_healthy

  # ─── Enable /docs and dev-mode logs for all services ────────────────────────
  hr-service:
    environment:
      SERVICE_ENV: development

  user-service:
    environment:
      SERVICE_ENV: development

  task-service:
    volumes:
      - ./services/task:/app
      # Re-mount the shared libs (auth, metrics, …) that the bind-mount above
      # otherwise masks (image COPYs them into /app/libs, but `./services/task`
      # overlays the whole /app and hides them). Read-only is enough — the
      # service only imports from them.
      - ./libs:/app/libs:ro
    command: ["bash", "/app/entrypoint.sh"]
    environment:
      SERVICE_ENV: development
      UVICORN_RELOAD: "true"

  cms-service:
    environment:
      SERVICE_ENV: development

  media-service:
    environment:
      SERVICE_ENV: development

  messenger-service:
    environment:
      SERVICE_ENV: development

  email-service:
    environment:
      SERVICE_ENV: development

  admin-service:
    environment:
      SERVICE_ENV: development

  # ─── MinIO (S3-compatible object storage, dev-only) ─────────────────────────
  # Per-service buckets are bootstrapped by `minio-bootstrap` below.
  # Console UI: http://localhost:9001  (login: minioadmin / minioadmin)
  # In production: stop this service and point S3_ENDPOINT in root .env at
  # AWS S3 (or other compatible). Schema-per-service stays the same.
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      # Prometheus scrapes /minio/v2/metrics/cluster; without this it gets 403.
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # One-shot job: creates the per-service buckets and "folder" placeholders
  # (S3 has no folders — we put a `.keep` object so the prefix is browsable
  # in the MinIO console). Re-running is idempotent (`mb --ignore-existing`).
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@minio:9000
    entrypoint: >
      /bin/sh -c "
        set -e;
        for b in ${MEDIA_S3_BUCKET:-htqweb-media} ${MESSENGER_S3_BUCKET:-htqweb-messenger} ${CMS_S3_BUCKET:-htqweb-cms} ${CONFERENCES_S3_BUCKET:-htqweb-conferences} ${MAIL_ATTACHMENTS_S3_BUCKET:-htqweb-mail-attachments}; do
          mc mb --ignore-existing local/$$b;
        done;
        echo placeholder | mc pipe local/${MESSENGER_S3_BUCKET:-htqweb-messenger}/chats/.keep;
        echo placeholder | mc pipe local/${CMS_S3_BUCKET:-htqweb-cms}/news/.keep;
        echo placeholder | mc pipe local/${CONFERENCES_S3_BUCKET:-htqweb-conferences}/recordings/.keep;
        echo placeholder | mc pipe local/${MAIL_ATTACHMENTS_S3_BUCKET:-htqweb-mail-attachments}/inbound/.keep;
        echo bootstrap-done;
      "
    restart: "no"

volumes:
  minio_data:
