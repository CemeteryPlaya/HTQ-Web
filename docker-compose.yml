# ═══════════════════════════════════════════════════════════════════════════════
# HTQWeb — Production Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
#
# Quick start:
#   1. cp .env.production .env    (fill in secrets)
#   2. docker compose up -d --build
#   3. docker compose ps          (verify all services are healthy)
#
# For HTTPS with Let's Encrypt:
#   1. Set SERVER_DOMAIN=your-domain.com in .env
#   2. docker compose up -d
#   3. docker compose exec certbot certbot certonly --webroot \
#        -w /var/www/certbot -d your-domain.com --email your@email.com --agree-tos
#   4. docker compose restart nginx
#
# ═══════════════════════════════════════════════════════════════════════════════

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: htqweb.settings.base
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-insecure}
  JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
  # Django (psycopg, sync) идёт НАПРЯМУЮ в Postgres: CONN_MAX_AGE пулит на уровне
  # приложения, а PgBouncer transaction-mode рвал бы DDL/prepared-statements.
  # Контейнер pgbouncer (:6432) остаётся для хостовых утилит/совместимости.
  DB_HOST: ${DB_HOST:-45.10.110.212}   # БД в Docker на VPS; офлайн — DB_HOST=db + --profile local-db
  DB_PORT: "${DB_PORT:-5432}"
  DB_NAME: ${DB_NAME:-htqweb}
  DB_USER: ${DB_USER:-htqweb}
  DB_PASSWORD: ${DB_PASSWORD:-change-me}
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/2
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-qa_superadmin@htq.test}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-SuperAdmin!2026}
  S3_BUCKET: htqweb-cms
  MEDIA_S3_BUCKET: htqweb-media
  S3_USE_PATH_STYLE: "true"

services:
  # ─── PostgreSQL (ЛОКАЛЬНАЯ, опционально) ──────────
  # Боевая БД — в Docker на VPS (DB_HOST=45.10.110.212, см. x-django-env). Этот
  # локальный контейнер под профилем local-db — только для офлайн-разработки без
  # VPS: `docker compose --profile local-db up -d db` + DB_HOST=db в .env.
  db:
    profiles: ["local-db"] 
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-htqweb}
      POSTGRES_USER: ${DB_USER:-htqweb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init-ltree.sql:/docker-entrypoint-initdb.d/01-ltree.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-htqweb}"]
      interval: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── PgBouncer (только с локальной БД) ───────────
  pgbouncer:
    profiles: ["local-db"]   # для VPS-БД не нужен (Django ходит напрямую)
    image: edoburu/pgbouncer:v1.25.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      # Reap leaked/orphaned connections so they can't exhaust the shared pool
      # and hang the whole platform. A container recreated mid-request (deploys)
      # orphans its server connection "idle in transaction"; without a timeout
      # PgBouncer pins it forever. 300s is far longer than any real request.
      IDLE_TRANSACTION_TIMEOUT: 300
      SERVER_IDLE_TIMEOUT: 240
      # asyncpg + SQLAlchemy sends `search_path` as a startup parameter so each
      # service lands in its own schema; PgBouncer in transaction mode must be
      # told to accept/forward it.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER:-htqweb} || exit 1"]
      interval: 3s
      retries: 10
      start_period: 5s
      timeout: 3s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis (кэш + channel layer) ────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── MinIO (S3-compatible object storage) ────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qa_superadmin@htq.test}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperAdmin!2026}
      # Prometheus scrapes /minio/v2/metrics/cluster; without this it gets 403.
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # ─── Database Exporters for Prometheus ─────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-htqweb}:${DB_PASSWORD:-change-me}@${DB_HOST:-45.10.110.212}:${DB_PORT:-5432}/${DB_NAME:-htqweb}?sslmode=disable
    ports:
      - "9187:9187"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Optional free translation backend. Start with:
  #   docker compose --profile translation up -d libretranslate
  # and set LIBRE_TRANSLATE_API_URL=http://libretranslate:5000 in services/hr/.env.
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles:
      - translation
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ru,en
      LT_UPDATE_MODELS: "true"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/languages >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Django backend — WSGI (весь /api/*, django-admin, static) ──────────
  # Единый Django заменил девять FastAPI-микросервисов. migrate + идемпотентный
  # сид админа (admin/admin12345) — ТОЛЬКО backend-web (RUN_MIGRATIONS=1);
  # entrypoint ждёт БД и мигрирует напрямую (DB_HOST=db).
  backend-web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
      # Только `manage.py migrate`. На боевой БД держим 0 (см. корневой .env).
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      # collectstatic + бакеты хранилища + сид админа — к схеме БД отношения
      # не имеют и нужны при каждом старте, поэтому НЕ зависят от флага выше.
      RUN_BOOTSTRAP: ${RUN_BOOTSTRAP:-1}
    command: ["gunicorn", "htqweb.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "60"]
    ports:
      - "8000:8000"
    # БД внешняя (VPS) — depends_on не нужен; docker-entrypoint.sh сам ждёт DB_HOST:DB_PORT.
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/core/v1/services/').status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Django backend — ASGI (SSE /api/requests/v1/stream + WS /ws/) ──────
  backend-asgi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
    command: ["uvicorn", "htqweb.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    depends_on:
      backend-web:
        condition: service_started
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Celery worker (фоновые задачи всех доменов) ────────────────────────
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
    command: ["celery", "-A", "htqweb", "worker", "-l", "info"]
    depends_on:
      backend-web:
        condition: service_started
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Celery beat (периодика из БД: django-celery-beat) ──────────────────
  backend-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
    command: ["celery", "-A", "htqweb", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      backend-web:
        condition: service_started
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Flower (мониторинг Celery) ─────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
    command: ["celery", "-A", "htqweb", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─── SFU (Mediasoup signaling + media) ──────────
  # Conference / WebRTC — requires TLS certs in production. Disabled in dev
  # (the `/conference` page is the only consumer; re-enable with
  # `docker compose --profile production up`).
  sfu:
    build:
      context: ./sfu
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    profiles:
      - production
    env_file: ./sfu/.env
    restart: unless-stopped
    environment:
      # Only overrides; everything else (WEBRTC_*, bitrates, TURN) comes from sfu/.env.
      SFU_HOST: 0.0.0.0
      SIGNALING_DISABLE_ORIGIN_CHECK: "true"
    ports:
      - "4443:4443"
      - "${WEBRTC_SERVER_PORT:-44444}:${WEBRTC_SERVER_PORT:-44444}/udp"
      - "${WEBRTC_SERVER_PORT:-44444}:${WEBRTC_SERVER_PORT:-44444}/tcp"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ─── Frontend builder (one-shot) ────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/html
    restart: "no"

  # ─── Nginx (reverse proxy + frontend + SSL) ─────
  # Only starts under the "production" profile. In dev, Vite on :3000 proxies
  # directly to each FastAPI service, so nginx isn't needed and stale upstream
  # resolution would leave the container in an unhealthy state.
  nginx:
    image: fholzer/nginx-brotli:latest
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      # SSL: Let's Encrypt certificates
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - sfu
      - backend-web
      - backend-asgi
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Certbot (Let's Encrypt SSL) ────────────────
  # Run once to obtain certificate, then renews automatically.
  # Usage:
  #   docker compose run --rm certbot certonly --webroot \
  #     -w /var/www/certbot -d your-domain.com --email your@email.com --agree-tos
  # Auto-renewal cron:
  #   docker compose run --rm certbot renew && docker compose restart nginx
  certbot:
    image: certbot/certbot:latest
    # Only needed in production (Let's Encrypt issuance + renewal for nginx).
    # Dev flow is plain HTTP; this container stays off the default profile
    # so it doesn't spin up pointlessly on localhost.
    profiles:
      - production
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # By default: do nothing (run manually or via cron)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─── WebTransport Proxy (QUIC signaling) ────────
  # Uses a self-signed cert from wt_certs volume and only makes sense in front
  # of the SFU. Off in dev along with SFU.
  webtransport:
    build:
      context: ./webtransport
      dockerfile: Dockerfile
    profiles:
      - production
    restart: unless-stopped
    environment:
      SFU_WS_URL: "ws://sfu:4443"
      WT_HOST: "0.0.0.0"
      WT_PORT: "4433"
      LOG_LEVEL: ${WT_LOG_LEVEL:-INFO}
    ports:
      - "4433:4433/udp"
    volumes:
      - wt_certs:/app/certs
    depends_on:
      - sfu
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Prometheus (Metrics Storage & Scraper) ─────
  prometheus:
    build:
      context: ./infra/logging/prometheus
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    healthcheck:
      # Prometheus serves under route-prefix /prometheus (--web.external-url),
      # so the health endpoint lives at /prometheus/-/healthy — not /-/healthy.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/prometheus/-/healthy || exit 1"]
      interval: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  # ─── Loki (log storage) ─────────────────────────
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./infra/logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 10s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Promtail (docker log shipper) ──────────────
  promtail:
    image: grafana/promtail:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/logging/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Grafana (logs + dashboards UI) ─────────────
  grafana:
    image: grafana/grafana-oss:10.4.4
    restart: unless-stopped
    # Build a JWKS from the platform-wide HS256 JWT secret before start, so
    # [auth.jwt] accepts the same access tokens user-service issues. The file
    # lands in /tmp (grafana runs unprivileged; /etc/grafana is read-only).
    entrypoint:
      - /bin/sh
      - -c
      - |
        k=$$(printf '%s' "$$JWT_SECRET" | base64 | tr -d '\n=' | tr '+/' '-_')
        printf '{"keys":[{"kty":"oct","use":"sig","alg":"HS256","k":"%s"}]}' "$$k" > /tmp/htqweb-jwks.json
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Served behind the edge under /grafana/ (nginx in prod, Vite in dev).
      # serve_from_sub_path keeps direct host access working at :3001/grafana/.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # ─── SSO with platform accounts (HTQWeb JWT, HS256 shared secret) ────
      # Frontend opens /grafana/?auth_token=<access JWT> (url_login). Roles:
      # superuser → Admin, staff → Editor, everyone else is rejected
      # (role_attribute_strict). Local admin/admin login keeps working.
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      GF_AUTH_JWT_ENABLED: "true"
      GF_AUTH_JWT_HEADER_NAME: "X-JWT-Assertion"
      GF_AUTH_JWT_URL_LOGIN: "true"
      GF_AUTH_JWT_USERNAME_CLAIM: "username"
      GF_AUTH_JWT_EMAIL_CLAIM: "email"
      GF_AUTH_JWT_AUTO_SIGN_UP: "true"
      GF_AUTH_JWT_JWK_SET_FILE: /tmp/htqweb-jwks.json
      GF_AUTH_JWT_EXPECT_CLAIMS: '{"iss": "htqweb-auth"}'
      GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH: "is_superuser && 'Admin' || is_staff && 'Editor'"
      GF_AUTH_JWT_ROLE_ATTRIBUTE_STRICT: "true"
      # Land admins straight on the service-metrics dashboard after login.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/htqweb-prometheus-services.json
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/logging/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./infra/logging/grafana-dashboards:/etc/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
  static_files:
  media_files:
  wt_certs:
  frontend_dist:
  certbot_conf:
  certbot_webroot:
  loki_data:
  grafana_data:
  minio_data:
  prometheus_data:
