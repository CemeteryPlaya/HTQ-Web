# ═══════════════════════════════════════════════════════════════════════════════
# HTQWeb — Production Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
#
# Quick start:
#   1. cp .env.production .env    (fill in secrets)
#   2. docker compose up -d --build
#   3. docker compose ps          (verify all services are healthy)
#
# For HTTPS with Let's Encrypt:
#   1. Set SERVER_DOMAIN=your-domain.com in .env
#   2. docker compose up -d
#   3. docker compose exec certbot certbot certonly --webroot \
#        -w /var/www/certbot -d your-domain.com --email your@email.com --agree-tos
#   4. docker compose restart nginx
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL ───────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-htqweb}
      POSTGRES_USER: ${DB_USER:-htqweb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init-ltree.sql:/docker-entrypoint-initdb.d/01-ltree.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-htqweb}"]
      interval: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── PgBouncer (connection pooler) ───────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      # Reap leaked/orphaned connections so they can't exhaust the shared pool
      # and hang the whole platform. A container recreated mid-request (deploys)
      # orphans its server connection "idle in transaction"; without a timeout
      # PgBouncer pins it forever. 300s is far longer than any real request.
      IDLE_TRANSACTION_TIMEOUT: 300
      SERVER_IDLE_TIMEOUT: 240
      # asyncpg + SQLAlchemy sends `search_path` as a startup parameter so each
      # service lands in its own schema; PgBouncer in transaction mode must be
      # told to accept/forward it.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER:-htqweb} || exit 1"]
      interval: 3s
      retries: 10
      start_period: 5s
      timeout: 3s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis (кэш + channel layer) ────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── MongoDB (HR documents, NoSQL storage) ────
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-htqweb}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change-me-mongo}
      MONGO_INITDB_DATABASE: htqweb_docs
    # Port intentionally NOT exposed to host — access only via Docker network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── MinIO (S3-compatible object storage) ────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qa_superadmin@htq.test}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperAdmin!2026}
      # Prometheus scrapes /minio/v2/metrics/cluster; without this it gets 403.
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # ─── Database Exporters for Prometheus ─────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-htqweb}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-htqweb}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    restart: unless-stopped
    command:
      - "--mongodb.uri=mongodb://${MONGO_USER:-htqweb}:${MONGO_PASSWORD:-change-me-mongo}@mongo:27017/admin?authSource=admin"
    ports:
      - "9216:9216"
    depends_on:
      mongo:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Optional free translation backend. Start with:
  #   docker compose --profile translation up -d libretranslate
  # and set LIBRE_TRANSLATE_API_URL=http://libretranslate:5000 in services/hr/.env.
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles:
      - translation
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ru,en
      LT_UPDATE_MODELS: "true"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/languages >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── User/Identity Service (JWT authority) ──────
  user-service:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    env_file: ./services/user/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_SCHEMA: auth
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: htqweb-auth
      SERVICE_NAME: user-identity
      SERVICE_PORT: 8005
      SERVICE_ENV: ${SERVICE_ENV:-production}
      # S2S — for avatar upload (user-service → media-service).
      # MUST match media-service.SERVICE_JWT_SECRET below.
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-change-me-service-secret}
      SERVICE_JWT_ALGORITHM: HS256
      MEDIA_SERVICE_URL: http://media-service:8009
    ports:
      - "8005:8005"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run migrations DIRECTLY against postgres (DB_HOST=db, port 5432) so
    # asyncpg's prepared-statement protocol survives — pgbouncer in
    # transaction-pool mode kills the very first BEGIN. After migrations the
    # actual uvicorn process inherits the env-level DB_HOST=pgbouncer and
    # uses the connection pool normally.
    command: >
      sh -c "
        DB_HOST=db DB_PORT=5432 PYTHONPATH=/app:/app/libs alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8005
      "
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8005/health/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  user-worker:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    env_file: ./services/user/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_SCHEMA: auth
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["dramatiq", "app.workers.actors", "--processes", "1", "--threads", "2"]
    healthcheck:
      disable: true

  user-scheduler:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    env_file: ./services/user/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_SCHEMA: auth
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.scheduler"]
    healthcheck:
      disable: true

  # ─── HR Service ─────────────────────────────────
  hr-service:
    build:
      context: .
      dockerfile: services/hr/Dockerfile
    env_file: ./services/hr/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_SCHEMA: public
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: htqweb-auth
      SERVICE_NAME: hr-service
      SERVICE_PORT: 8006
      SERVICE_ENV: ${SERVICE_ENV:-production}
      API_PREFIX: /api/hr/v1
      MONGO_URI: mongodb://${MONGO_USER:-htqweb}:${MONGO_PASSWORD:-change-me-mongo}@mongo:27017/htqweb_docs?authSource=admin
      MEDIA_SERVICE_URL: http://media-service:8009
      INTERNAL_S2S_TOKEN: ${INTERNAL_S2S_TOKEN:-internal-dev-secret}
    ports:
      - "8006:8006"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8006/health/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  hr-worker:
    build:
      context: .
      dockerfile: services/hr/Dockerfile
    env_file: ./services/hr/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_SCHEMA: public
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["dramatiq", "app.workers.actors", "--processes", "1", "--threads", "2"]
    healthcheck:
      disable: true

  hr-scheduler:
    build:
      context: .
      dockerfile: services/hr/Dockerfile
    env_file: ./services/hr/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_SCHEMA: public
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.scheduler"]
    healthcheck:
      disable: true

  # ─── Task Service ───────────────────────────────
  task-service:
    build:
      context: .
      dockerfile: services/task/Dockerfile
    env_file: ./services/task/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_SCHEMA: public
      REDIS_URL: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: htqweb-auth
      SERVICE_NAME: task-service
      SERVICE_PORT: 8007
      SERVICE_ENV: ${SERVICE_ENV:-production}
      API_PREFIX: /api/tasks/v1
    ports:
      - "8007:8007"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8007/health/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  task-worker:
    build:
      context: .
      dockerfile: services/task/Dockerfile
    env_file: ./services/task/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_SCHEMA: public
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["dramatiq", "app.workers.actors", "--processes", "1", "--threads", "2"]
    healthcheck:
      disable: true

  task-scheduler:
    build:
      context: .
      dockerfile: services/task/Dockerfile
    env_file: ./services/task/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_SCHEMA: public
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.scheduler"]
    healthcheck:
      disable: true

  # ─── Requests Service ─────────────────────────
  requests-service:
    build:
      context: .
      dockerfile: services/requests/Dockerfile
    env_file: ./services/requests/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_SCHEMA: public
      REDIS_URL: redis://redis:6379/7
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: htqweb-auth
      SERVICE_NAME: requests-service
      SERVICE_PORT: 8013
      SERVICE_ENV: ${SERVICE_ENV:-production}
      MESSENGER_INTERNAL_URL: http://messenger-service:8008
      MESSENGER_INTERNAL_TOKEN: ${MESSENGER_INTERNAL_TOKEN:-internal-dev-secret}
      HR_INTERNAL_URL: http://hr-service:8006
      INTERNAL_S2S_TOKEN: ${INTERNAL_S2S_TOKEN:-internal-dev-secret}
    ports:
      - "8013:8013"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8013/health/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  requests-worker:
    build:
      context: .
      dockerfile: services/requests/Dockerfile
    env_file: ./services/requests/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_SCHEMA: public
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/7
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      MESSENGER_INTERNAL_URL: http://messenger-service:8008
      MESSENGER_INTERNAL_TOKEN: ${MESSENGER_INTERNAL_TOKEN:-internal-dev-secret}
      HR_INTERNAL_URL: http://hr-service:8006
      INTERNAL_S2S_TOKEN: ${INTERNAL_S2S_TOKEN:-internal-dev-secret}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["dramatiq", "app.workers.actors", "--processes", "1", "--threads", "2"]
    healthcheck:
      disable: true

  # ─── Messenger Service ─────────────────────────
  messenger-service:
    build:
      context: .
      dockerfile: services/messenger/Dockerfile
    env_file: ./services/messenger/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/3
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: htqweb-auth
      SERVICE_NAME: messenger-service
      SERVICE_PORT: 8008
      ATTACHMENT_DIR: /app/data/attachments
      MESSENGER_INTERNAL_TOKEN: ${MESSENGER_INTERNAL_TOKEN:-internal-dev-secret}
      # ─── S3 storage ──────────────────────────────────────────────────────
      # Per the "1 service = 1 bucket" rule (services/README.md). MinIO in dev
      # via docker-compose.dev.yml; in prod swap S3_ENDPOINT for AWS/Yandex.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${MESSENGER_S3_BUCKET:-htqweb-messenger}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      # HMAC secret for the per-attachment signed redirect URL (browser uses
      # the URL inside <img src> / <a href> without an Authorization header).
      ATTACHMENT_SIGNED_URL_SECRET: ${ATTACHMENT_SIGNED_URL_SECRET:-change-me-attachment-signed-secret}
      ATTACHMENT_SIGNED_URL_TTL: "3600"
      # Public-facing prefix the signed redirect endpoint uses when issuing
      # presigned S3 URLs to the browser. In prod set to your S3 / CDN host.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    ports:
      - "8008:8008"
    volumes:
      - messenger_attachments:/app/data/attachments
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]

  messenger-worker:
    build:
      context: .
      dockerfile: services/messenger/Dockerfile
    env_file: ./services/messenger/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/3
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${MESSENGER_S3_BUCKET:-htqweb-messenger}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    volumes:
      - messenger_attachments:/app/data/attachments
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["dramatiq", "app.workers.actors", "--processes", "2", "--threads", "4"]
    healthcheck:
      disable: true

  messenger-scheduler:
    build:
      context: .
      dockerfile: services/messenger/Dockerfile
    env_file: ./services/messenger/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/3
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${MESSENGER_S3_BUCKET:-htqweb-messenger}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.scheduler"]
    healthcheck:
      disable: true

  # ─── Media Service ────────────────────────────
  media-service:
    build:
      context: ./services/media
      dockerfile: Dockerfile
    env_file: ./services/media/.env
    restart: unless-stopped
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/4
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      # S2S — MUST match user-service.SERVICE_JWT_SECRET above. When a JWT has
      # claim `service=True`, media-service accepts the call as internal and
      # reads X-User-Id header for ownership.
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-change-me-service-secret}
      SERVICE_JWT_ALGORITHM: HS256
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      MEDIA_ROOT: /app/media
      SERVICE_NAME: media-service
      SERVICE_PORT: 8009
      # Per the "1 service = 1 bucket" rule (services/README.md).
      S3_BUCKET: ${MEDIA_S3_BUCKET:-htqweb-media}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    ports:
      - "8009:8009"
    volumes:
      - media_files:/app/media
    depends_on:
      pgbouncer:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]

  media-worker:
    build: ./services/media
    env_file: ./services/media/.env
    restart: unless-stopped
    environment:
      DB_HOST: pgbouncer
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/4
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      MEDIA_ROOT: /app/media
      S3_BUCKET: ${MEDIA_S3_BUCKET:-htqweb-media}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    volumes:
      - media_files:/app/media
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["dramatiq", "app.workers.actors", "--processes", "1", "--threads", "2"]
    healthcheck:
      disable: true

  media-scheduler:
    build: ./services/media
    env_file: ./services/media/.env
    restart: unless-stopped
    environment:
      DB_HOST: pgbouncer
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/4
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      MEDIA_ROOT: /app/media
      S3_BUCKET: ${MEDIA_S3_BUCKET:-htqweb-media}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    volumes:
      - media_files:/app/media
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.scheduler"]
    healthcheck:
      disable: true

  # ─── CMS Service ──────────────────────────────
  cms-service:
    build:
      context: .
      dockerfile: services/cms/Dockerfile
    env_file: ./services/cms/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      REDIS_URL: redis://redis:6379/5
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: htqweb-auth
      SERVICE_NAME: cms-service
      SERVICE_PORT: 8011
      # ─── S3 storage (per "1 service = 1 bucket" rule) ────────────────────
      # Stores news content snapshots (content.md), per-post metadata.json,
      # cover images and post attachments. See services/cms/app/services/.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${CMS_S3_BUCKET:-htqweb-cms}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      NEWS_SIGNED_URL_SECRET: ${NEWS_SIGNED_URL_SECRET:-change-me-news-signed-secret}
      NEWS_SIGNED_URL_TTL: "3600"
    ports:
      - "8011:8011"
    depends_on:
      pgbouncer:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]

  cms-worker:
    build:
      context: .
      dockerfile: services/cms/Dockerfile
    env_file: ./services/cms/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/5
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${CMS_S3_BUCKET:-htqweb-cms}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["dramatiq", "app.workers.actors", "--processes", "1", "--threads", "2"]
    healthcheck:
      disable: true

  cms-scheduler:
    build:
      context: .
      dockerfile: services/cms/Dockerfile
    env_file: ./services/cms/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/5
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${CMS_S3_BUCKET:-htqweb-cms}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.scheduler"]
    healthcheck:
      disable: true

  # ─── Email Service ────────────────────────────
  email-service:
    build:
      context: .
      dockerfile: services/email/Dockerfile
    env_file: ./services/email/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/6
      SERVICE_NAME: email-service
      SERVICE_PORT: 8010
      # JWT shared with user-service so /api/email/v1/* validates the same
      # admin_session bearer the rest of the platform issues. Without this
      # the service falls back to settings default ("change-me") and 401s.
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: htqweb-auth
      MICROSOFT_OAUTH_REDIRECT_URI: http://localhost:3000/email/oauth/callback/
    ports:
      - "8010:8010"
    depends_on:
      redis:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]

  email-worker:
    build:
      context: .
      dockerfile: services/email/Dockerfile
    env_file: ./services/email/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/6
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      MICROSOFT_OAUTH_REDIRECT_URI: http://localhost:3000/email/oauth/callback/
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["dramatiq", "app.workers.actors"]
    healthcheck:
      disable: true

  email-scheduler:
    build:
      context: .
      dockerfile: services/email/Dockerfile
    env_file: ./services/email/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/6
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      MICROSOFT_OAUTH_REDIRECT_URI: http://localhost:3000/email/oauth/callback/
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.scheduler"]
    healthcheck:
      disable: true

  # ─── IMAP IDLE supervisor (corporate Mailcow push) ────────────
  # One process per service replica. Holds an IMAP IDLE session per active
  # corporate account so new mail lands in the local DB within ~10s without
  # polling. No-op if MAILCOW_API_URL is empty.
  email-imap-idle:
    build:
      context: .
      dockerfile: services/email/Dockerfile
    env_file: ./services/email/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/libs
      DB_HOST: pgbouncer
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/6
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.imap_idle_supervisor"]
    healthcheck:
      disable: true

  # ─── Central Admin Aggregator ──────────────────
  admin-service:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    env_file: ./services/admin/.env
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/services:/app/libs
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      USER_SERVICE_URL: http://user-service:8005
      REDIS_URL: redis://redis:6379/0
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: htqweb_docs
      MONGO_USER: ${MONGO_USER:-htqweb}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-change-me-mongo}
      MONGO_URI: mongodb://${MONGO_USER:-htqweb}:${MONGO_PASSWORD:-change-me-mongo}@mongo:27017/htqweb_docs?authSource=admin
      MINIO_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      MINIO_CONSOLE_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qa_superadmin@htq.test}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperAdmin!2026}
      S3_BUCKET: ${S3_BUCKET:-htqweb-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      SQLADMIN_URL: /sqladmin/
      MONGO_ADMIN_URL: /mongo-admin/
    ports:
      - "8012:8012"
    volumes:
      - ./services/user:/services/user:ro
      - ./services/hr:/services/hr:ro
      - ./services/task:/services/task:ro
      - ./services/cms:/services/cms:ro
      - ./services/media:/services/media:ro
      - ./services/messenger:/services/messenger:ro
      - ./services/email:/services/email:ro
    depends_on:
      pgbouncer:
        condition: service_healthy

  # ─── AdminJS Panel (unified SQL+MongoDB admin) ──
  adminjs-panel:
    build:
      context: ./services/adminjs
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-htqweb}:${DB_PASSWORD:-change-me}@pgbouncer:5432/${DB_NAME:-htqweb}
      MONGO_URI: mongodb://${MONGO_USER:-htqweb}:${MONGO_PASSWORD:-change-me-mongo}@mongo:27017/htqweb_docs?authSource=admin
      ADMIN_EMAIL: ${ADMINJS_EMAIL:-admin@htq.local}
      ADMIN_PASSWORD: ${ADMINJS_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      USER_SERVICE_URL: http://user-service:8005
      ADMIN_ROOT_PATH: /mongo-admin
      PORT: 3300
      NODE_ENV: production
    ports:
      - "3300:3300"
    depends_on:
      pgbouncer:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in-container localhost resolves to ::1 first,
      # but Node binds IPv4 0.0.0.0 only, so the check would always fail.
      # Path follows ADMIN_ROOT_PATH (/mongo-admin) above.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3300/mongo-admin/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── SFU (Mediasoup signaling + media) ──────────
  # Conference / WebRTC — requires TLS certs in production. Disabled in dev
  # (the `/conference` page is the only consumer; re-enable with
  # `docker compose --profile production up`).
  sfu:
    build:
      context: ./sfu
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    profiles:
      - production
    env_file: ./sfu/.env
    restart: unless-stopped
    environment:
      # Only overrides; everything else (WEBRTC_*, bitrates, TURN) comes from sfu/.env.
      SFU_HOST: 0.0.0.0
      SIGNALING_DISABLE_ORIGIN_CHECK: "true"
    ports:
      - "4443:4443"
      - "${WEBRTC_SERVER_PORT:-44444}:${WEBRTC_SERVER_PORT:-44444}/udp"
      - "${WEBRTC_SERVER_PORT:-44444}:${WEBRTC_SERVER_PORT:-44444}/tcp"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ─── Frontend builder (one-shot) ────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/html
    restart: "no"

  # ─── Nginx (reverse proxy + frontend + SSL) ─────
  # Only starts under the "production" profile. In dev, Vite on :3000 proxies
  # directly to each FastAPI service, so nginx isn't needed and stale upstream
  # resolution would leave the container in an unhealthy state.
  nginx:
    image: fholzer/nginx-brotli:latest
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      # SSL: Let's Encrypt certificates
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - sfu
      - hr-service
      - user-service
      - task-service
      - messenger-service
      - media-service
      - cms-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Certbot (Let's Encrypt SSL) ────────────────
  # Run once to obtain certificate, then renews automatically.
  # Usage:
  #   docker compose run --rm certbot certonly --webroot \
  #     -w /var/www/certbot -d your-domain.com --email your@email.com --agree-tos
  # Auto-renewal cron:
  #   docker compose run --rm certbot renew && docker compose restart nginx
  certbot:
    image: certbot/certbot:latest
    # Only needed in production (Let's Encrypt issuance + renewal for nginx).
    # Dev flow is plain HTTP; this container stays off the default profile
    # so it doesn't spin up pointlessly on localhost.
    profiles:
      - production
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # By default: do nothing (run manually or via cron)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─── WebTransport Proxy (QUIC signaling) ────────
  # Uses a self-signed cert from wt_certs volume and only makes sense in front
  # of the SFU. Off in dev along with SFU.
  webtransport:
    build:
      context: ./webtransport
      dockerfile: Dockerfile
    profiles:
      - production
    restart: unless-stopped
    environment:
      SFU_WS_URL: "ws://sfu:4443"
      WT_HOST: "0.0.0.0"
      WT_PORT: "4433"
      LOG_LEVEL: ${WT_LOG_LEVEL:-INFO}
    ports:
      - "4433:4433/udp"
    volumes:
      - wt_certs:/app/certs
    depends_on:
      - sfu
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Prometheus (Metrics Storage & Scraper) ─────
  prometheus:
    build:
      context: ./infra/logging/prometheus
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    healthcheck:
      # Prometheus serves under route-prefix /prometheus (--web.external-url),
      # so the health endpoint lives at /prometheus/-/healthy — not /-/healthy.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/prometheus/-/healthy || exit 1"]
      interval: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  # ─── Loki (log storage) ─────────────────────────
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./infra/logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 10s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Promtail (docker log shipper) ──────────────
  promtail:
    image: grafana/promtail:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/logging/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Grafana (logs + dashboards UI) ─────────────
  grafana:
    image: grafana/grafana-oss:10.4.4
    restart: unless-stopped
    # Build a JWKS from the platform-wide HS256 JWT secret before start, so
    # [auth.jwt] accepts the same access tokens user-service issues. The file
    # lands in /tmp (grafana runs unprivileged; /etc/grafana is read-only).
    entrypoint:
      - /bin/sh
      - -c
      - |
        k=$$(printf '%s' "$$JWT_SECRET" | base64 | tr -d '\n=' | tr '+/' '-_')
        printf '{"keys":[{"kty":"oct","use":"sig","alg":"HS256","k":"%s"}]}' "$$k" > /tmp/htqweb-jwks.json
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Served behind the edge under /grafana/ (nginx in prod, Vite in dev).
      # serve_from_sub_path keeps direct host access working at :3001/grafana/.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # ─── SSO with platform accounts (HTQWeb JWT, HS256 shared secret) ────
      # Frontend opens /grafana/?auth_token=<access JWT> (url_login). Roles:
      # superuser → Admin, staff → Editor, everyone else is rejected
      # (role_attribute_strict). Local admin/admin login keeps working.
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      GF_AUTH_JWT_ENABLED: "true"
      GF_AUTH_JWT_HEADER_NAME: "X-JWT-Assertion"
      GF_AUTH_JWT_URL_LOGIN: "true"
      GF_AUTH_JWT_USERNAME_CLAIM: "username"
      GF_AUTH_JWT_EMAIL_CLAIM: "email"
      GF_AUTH_JWT_AUTO_SIGN_UP: "true"
      GF_AUTH_JWT_JWK_SET_FILE: /tmp/htqweb-jwks.json
      GF_AUTH_JWT_EXPECT_CLAIMS: '{"iss": "htqweb-auth"}'
      GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH: "is_superuser && 'Admin' || is_staff && 'Editor'"
      GF_AUTH_JWT_ROLE_ATTRIBUTE_STRICT: "true"
      # Land admins straight on the service-metrics dashboard after login.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/htqweb-prometheus-services.json
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/logging/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./infra/logging/grafana-dashboards:/etc/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
  static_files:
  media_files:
  messenger_attachments:
  wt_certs:
  frontend_dist:
  certbot_conf:
  certbot_webroot:
  loki_data:
  grafana_data:
  mongo_data:
  minio_data:
  prometheus_data:
