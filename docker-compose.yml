# ═══════════════════════════════════════════════════════════════════════════════
# HTQWeb — Production Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
#
# Quick start:
#   1. cp .env.production .env    (fill in secrets)
#   2. docker compose up -d --build
#   3. docker compose ps          (verify all services are healthy)
#
# For HTTPS with Let's Encrypt:
#   1. Set SERVER_DOMAIN=your-domain.com in .env
#   2. docker compose up -d
#   3. docker compose exec certbot certbot certonly --webroot \
#        -w /var/www/certbot -d your-domain.com --email your@email.com --agree-tos
#   4. docker compose restart nginx
#
# ═══════════════════════════════════════════════════════════════════════════════

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: htqweb.settings.base
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-insecure}
  JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
  # Среда и политика подмен (htqweb/fallback.py). production и staging ведут
  # себя одинаково: fallback срабатывает молча для пользователя, но пишет
  # строку FALLBACK и растит htqweb_fallback_total. Строгий режим (подмен нет,
  # летит исключение) — у разработчика: docker-compose.dev.yml.
  # Пустая FALLBACK_MODE = «выведи из среды»; strict|log перебивают.
  HTQ_ENV: ${HTQ_ENV:-production}
  FALLBACK_MODE: ${FALLBACK_MODE:-}
  FALLBACK_LOG_LEVEL: ${FALLBACK_LOG_LEVEL:-INFO}
  # Django (psycopg, sync) идёт НАПРЯМУЮ в Postgres: CONN_MAX_AGE пулит на уровне
  # приложения, а PgBouncer transaction-mode рвал бы DDL/prepared-statements.
  # Контейнер pgbouncer (:6432) остаётся для хостовых утилит/совместимости.
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-htqweb}
  DB_USER: ${DB_USER:-htqweb}
  DB_PASSWORD: ${DB_PASSWORD:-change-me}
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/2
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-qa_superadmin@htq.test}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-SuperAdmin!2026}
  S3_BUCKET: htqweb-cms
  MEDIA_S3_BUCKET: htqweb-media
  S3_USE_PATH_STYLE: "true"
  # ── Конференция (GET /api/cms/v1/conference/config) ──
  # SFU-сигналинг идёт тем же origin'ом, что и страница (nginx → /ws/sfu/),
  # поэтому URL пуст: фронт соберёт ws(s)://<origin>/ws/sfu/ сам.
  CONFERENCE_SFU_URL: ${CONFERENCE_SFU_URL:-}
  # QUIC-мост: публичный https-адрес webtransport-контейнера (UDP :4433).
  # Пусто = мост не анонсируем, фронт остаётся на WebSocket.
  CONFERENCE_WT_URL: ${CONFERENCE_WT_URL:-}
  # Отпечаток самоподписанного сертификата моста (том wt_certs). С
  # сертификатом от настоящего CA файла нет — и он не нужен.
  CONFERENCE_WT_CERT_HASH_FILE: ${CONFERENCE_WT_CERT_HASH_FILE:-/app/wt-certs/cert.sha256}
  # ── Запись, история и протокол конференций (apps/conference) ──
  # Запись серверная и включена всегда: SFU пишет по дорожке на участника
  # (ffmpeg -c copy), backend-media-worker сводит их в одно видео и
  # распознаёт речь. Через CONFERENCE_RETENTION_DAYS медиа стирается
  # полностью; история встречи и текстовый протокол остаются.
  CONFERENCE_RECORDING_ENABLED: ${CONFERENCE_RECORDING_ENABLED:-true}
  CONFERENCE_RETENTION_DAYS: ${CONFERENCE_RETENTION_DAYS:-25}
  # Общий секрет канала SFU → Django (/api/conference/v1/internal/*). Пустой
  # ЗАКРЫВАЕТ приём наглухо, а не открывает всем — см. internal_auth.py.
  CONFERENCE_INTERNAL_TOKEN: ${CONFERENCE_INTERNAL_TOKEN:-}
  CONFERENCE_RAW_DIR: /recordings
  CONFERENCE_S3_BUCKET: ${CONFERENCE_S3_BUCKET:-}
  CONFERENCE_ORPHAN_HOURS: ${CONFERENCE_ORPHAN_HOURS:-6}
  CONFERENCE_MAX_TILES: ${CONFERENCE_MAX_TILES:-9}
  WHISPER_MODEL: ${WHISPER_MODEL:-medium}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
  WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
  # ── Корпоративная почта (apps/mail) ──
  # Пусто = почтовый сервер не подключён: ящики заводятся только локальной
  # строкой, сверка сообщает "сервер недоступен". Подробности и рецепты —
  # в .env.example.
  CORPORATE_MAIL_DOMAIN: ${CORPORATE_MAIL_DOMAIN:-}
  MAILCOW_DOMAIN: ${MAILCOW_DOMAIN:-}
  MAILCOW_API_URL: ${MAILCOW_API_URL:-}
  MAILCOW_API_KEY: ${MAILCOW_API_KEY:-}
  MAILCOW_DEFAULT_QUOTA_MB: ${MAILCOW_DEFAULT_QUOTA_MB:-1024}
  # auto | mailcow | imap | none
  MAIL_PROVISIONER: ${MAIL_PROVISIONER:-auto}
  # Через SSH-туннель: IMAP_HOST=mail-tunnel, IMAP_PORT=1143, IMAP_SSL=false
  # (шифрует SSH). Напрямую: реальный хост, 993, IMAP_SSL=true.
  IMAP_HOST: ${IMAP_HOST:-}
  IMAP_PORT: ${IMAP_PORT:-993}
  IMAP_SSL: ${IMAP_SSL:-true}
  IMAP_STARTTLS: ${IMAP_STARTTLS:-false}
  IMAP_TLS_SERVER_HOSTNAME: ${IMAP_TLS_SERVER_HOSTNAME:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SSL: ${SMTP_SSL:-false}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  MAIL_SYNC_FOLDERS: ${MAIL_SYNC_FOLDERS:-INBOX,Sent}
  MAIL_SYNC_MAX_MESSAGES: ${MAIL_SYNC_MAX_MESSAGES:-200}
  MAIL_SYNC_PUSH_FLAGS: ${MAIL_SYNC_PUSH_FLAGS:-true}
  MAIL_RECONCILE_AUTO_APPLY: ${MAIL_RECONCILE_AUTO_APPLY:-false}

services:
  # ─── PostgreSQL ───────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-htqweb}
      POSTGRES_USER: ${DB_USER:-htqweb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init-ltree.sql:/docker-entrypoint-initdb.d/01-ltree.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-htqweb}"]
      interval: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── PgBouncer (connection pooler) ───────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-htqweb}
      DB_USER: ${DB_USER:-htqweb}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      # Reap leaked/orphaned connections so they can't exhaust the shared pool
      # and hang the whole platform. A container recreated mid-request (deploys)
      # orphans its server connection "idle in transaction"; without a timeout
      # PgBouncer pins it forever. 300s is far longer than any real request.
      IDLE_TRANSACTION_TIMEOUT: 300
      SERVER_IDLE_TIMEOUT: 240
      # asyncpg + SQLAlchemy sends `search_path` as a startup parameter so each
      # service lands in its own schema; PgBouncer in transaction mode must be
      # told to accept/forward it.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER:-htqweb} || exit 1"]
      interval: 3s
      retries: 10
      start_period: 5s
      timeout: 3s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis (кэш + channel layer) ────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── MinIO (S3-compatible object storage) ────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qa_superadmin@htq.test}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperAdmin!2026}
      # Prometheus scrapes /minio/v2/metrics/cluster; without this it gets 403.
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # ─── Database Exporters for Prometheus ─────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-htqweb}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-htqweb}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Метрики хоста: CPU, память, ДИСК, сеть ────────────────────────────
  # Диск — главная причина, по которой сервис вообще заведён: «кончилось
  # место» роняет прод чаще всего, а до этого не ловилось ничем.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    # pid: host нужен, чтобы видеть процессы хоста, а не только свои.
    pid: host
    command:
      - "--path.rootfs=/host"
      # Служебные ФС докера только зашумляют метрики файловых систем.
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)"
    volumes:
      # Без `rslave` намеренно: Docker Desktop/WSL2 отказывается монтировать
      # `/` с propagation («path / is mounted on / but it is not a shared or
      # slave mount»), и сервис не стартует на машинах разработчиков.
      # Плата — файловые системы, примонтированные ПОСЛЕ старта контейнера,
      # в метриках не появятся; на фиксированном прод-хосте это не случай.
      - /:/host:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Метрики контейнеров: ресурсы, рестарты, OOM ───────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    # Доступ к cgroups и сокету докера — иначе метрик контейнеров не собрать.
    # Это расширение прав; если на боевом хосте так нельзя, сервис можно
    # снять — метрики хоста (node-exporter) от этого не пострадают.
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      # Длина очереди Celery. Очередь — обычный Redis-список `celery` в
      # логической БД /9 (CELERY_BROKER_URL в settings/base.py; /8 занят
      # кэшем). Отдаётся метрикой redis_key_size — отдельный celery-exporter
      # ради одного числа заводить незачем, Flower его тоже не показывает.
      REDIS_EXPORTER_CHECK_KEYS: "9=celery"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Optional free translation backend. Start with:
  #   docker compose --profile translation up -d libretranslate
  # and set LIBRE_TRANSLATE_API_URL=http://libretranslate:5000 in services/hr/.env.
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles:
      - translation
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ru,en
      LT_UPDATE_MODELS: "true"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/languages >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── SSH-туннель до корпоративного почтового сервера ────────────────────
  # Профиль `mail-tunnel`: сервис стартует только там, где почтовый сервер
  # закрыт наружу и доступен исключительно по SSH.
  #
  #   docker compose --profile mail-tunnel up -d mail-tunnel
  #
  # Подготовка (один раз):
  #   1. положить приватный ключ в infra/mail-tunnel/ssh/id_ed25519 (chmod 600);
  #   2. ssh-keyscan -p <порт> <хост> > infra/mail-tunnel/ssh/known_hosts;
  #   3. заполнить MAIL_TUNNEL_* в .env;
  #   4. указать backend'у адрес туннеля:
  #        IMAP_HOST=mail-tunnel   IMAP_PORT=1143
  #        SMTP_HOST=mail-tunnel   SMTP_PORT=1587
  #
  # Порты наружу НЕ публикуются: туннель виден только контейнерам этой сети.
  mail-tunnel:
    build:
      context: ./infra/mail-tunnel
      dockerfile: Dockerfile
    profiles:
      - mail-tunnel
    restart: unless-stopped
    environment:
      MAIL_TUNNEL_SSH_HOST: ${MAIL_TUNNEL_SSH_HOST:-}
      MAIL_TUNNEL_SSH_PORT: ${MAIL_TUNNEL_SSH_PORT:-22}
      MAIL_TUNNEL_SSH_USER: ${MAIL_TUNNEL_SSH_USER:-}
      MAIL_TUNNEL_SSH_KEY: ${MAIL_TUNNEL_SSH_KEY:-/ssh/id_ed25519}
      MAIL_TUNNEL_REMOTE_IMAP_HOST: ${MAIL_TUNNEL_REMOTE_IMAP_HOST:-127.0.0.1}
      MAIL_TUNNEL_REMOTE_IMAP_PORT: ${MAIL_TUNNEL_REMOTE_IMAP_PORT:-993}
      MAIL_TUNNEL_REMOTE_SMTP_HOST: ${MAIL_TUNNEL_REMOTE_SMTP_HOST:-}
      MAIL_TUNNEL_REMOTE_SMTP_PORT: ${MAIL_TUNNEL_REMOTE_SMTP_PORT:-587}
      MAIL_TUNNEL_LOCAL_IMAP_PORT: ${MAIL_TUNNEL_LOCAL_IMAP_PORT:-1143}
      MAIL_TUNNEL_LOCAL_SMTP_PORT: ${MAIL_TUNNEL_LOCAL_SMTP_PORT:-1587}
    volumes:
      - ./infra/mail-tunnel/ssh:/ssh:ro
    healthcheck:
      # Порт слушает ⇒ ssh -L поднялся. Логин на почтовый сервер отсюда не
      # проверяем: у туннеля нет и не должно быть почтовых учёток.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${MAIL_TUNNEL_LOCAL_IMAP_PORT:-1143} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Django backend — WSGI (весь /api/*, django-admin, static) ──────────
  # Единый Django заменил девять FastAPI-микросервисов. migrate + идемпотентный
  # сид админа (admin/admin12345) — ТОЛЬКО backend-web (RUN_MIGRATIONS=1);
  # entrypoint ждёт БД и мигрирует напрямую (DB_HOST=db).
  backend-web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
      # Только `manage.py migrate`. На боевой БД держим 0 (см. корневой .env).
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      # collectstatic + бакеты хранилища + сид админа — к схеме БД отношения
      # не имеют и нужны при каждом старте, поэтому НЕ зависят от флага выше.
      RUN_BOOTSTRAP: ${RUN_BOOTSTRAP:-1}
      # Мультипроцессные метрики: 4 воркера пишут счётчики в общий каталог,
      # иначе скрейп попадал бы в случайный воркер (см. htqweb/gunicorn_conf.py).
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus
    command: ["gunicorn", "htqweb.wsgi:application", "-c", "python:htqweb.gunicorn_conf", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "60"]
    ports:
      - "8000:8000"
    # Каталог метрик — в памяти: файлы перезаписываются на каждый запрос,
    # переживать рестарт не должны (мастер их и так чистит) и диску не нужны.
    tmpfs:
      - /run/prometheus
    volumes:
      # Только чтобы прочитать cert.sha256 QUIC-моста и отдать его фронту
      # в conference/config (dev-сценарий с самоподписанным сертификатом).
      - wt_certs:/app/wt-certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/core/v1/services/').status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Django backend — ASGI (SSE /api/requests/v1/stream + WS /ws/) ──────
  backend-asgi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
    command: ["uvicorn", "htqweb.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    depends_on:
      backend-web:
        condition: service_started
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Celery worker (фоновые задачи всех доменов) ────────────────────────
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
    # -E включает отправку событий задач. Без него Flower (а значит и
    # Prometheus, который скрейпит его /metrics) видит только самого воркера,
    # но не то, что он выполняет.
    command: ["celery", "-A", "htqweb", "worker", "-l", "info", "-E"]
    depends_on:
      backend-web:
        condition: service_started
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Celery worker обработки записей конференций ────────────────────────
  # Отдельный воркер и отдельный образ (с ffmpeg и faster-whisper), потому что
  # сведение часовой встречи и распознавание речи занимают десятки минут: в
  # общей очереди они задержали бы отправку почты и пересчёт метрик. Слушает
  # ТОЛЬКО conference_media — очередь, в которую задачи кладёт
  # CELERY_TASK_ROUTES (htqweb/settings/base.py). Общий backend-worker
  # запущен без -Q, то есть в эту очередь не заглядывает.
  backend-media-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.media
    restart: unless-stopped
    environment:
      <<: *django-env
      # Миграции и bootstrap — работа backend-web (единственного, у кого
      # RUN_MIGRATIONS=1). Второй мигрирующий процесс — это гонка.
      RUN_MIGRATIONS: "0"
      RUN_BOOTSTRAP: "0"
    command: ["celery", "-A", "htqweb", "worker", "-l", "info", "-E",
              "-Q", "conference_media", "-c", "1"]
    volumes:
      # Сырые дорожки пишет sfu, читает этот воркер — том общий.
      - conference_raw:/recordings
      # Веса Whisper (~1.5 ГБ для medium): без тома они скачивались бы заново
      # при каждой пересборке образа.
      - whisper_models:/models
    depends_on:
      backend-web:
        condition: service_started
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Celery beat (периодика из БД: django-celery-beat) ──────────────────
  backend-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
    command: ["celery", "-A", "htqweb", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      backend-web:
        condition: service_started
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Flower (мониторинг Celery) ─────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *django-env
    command: ["celery", "-A", "htqweb", "flower", "--port=5555"]
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─── SFU (Mediasoup signaling + media) ──────────
  # Conference / WebRTC. Сигналинг — plain ws внутри сети compose: TLS
  # терминирует nginx (prod) / Vite-прокси (dev), поэтому SIGNALING_REQUIRE_TLS
  # выключен, а вместо него обязателен платформенный JWT (SIGNALING_REQUIRE_AUTH).
  #
  # WEBRTC_ANNOUNCED_IP обязателен: с wildcard listenIp и пустым announcedIp
  # SFU падает на старте (sfu/src/config.ts::validateListenIps), иначе клиенты
  # получили бы SDP с 0.0.0.0 и чёрное видео. В прод — публичный IP хоста.
  sfu:
    build:
      context: ./sfu
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    # Тонкая настройка (битрейты, TURN, воркеры) — необязательный sfu/.env;
    # ключи из environment ниже имеют приоритет над ним.
    env_file:
      - path: ./sfu/.env
        required: false
    restart: unless-stopped
    environment:
      SFU_HOST: 0.0.0.0
      SFU_PORT: "4443"
      # Та же ось среды и та же политика подмен, что у Django (sfu/src/fallback.ts).
      HTQ_ENV: ${HTQ_ENV:-production}
      FALLBACK_MODE: ${FALLBACK_MODE:-}
      # JWT: тот же секрет и issuer, что у Django (htqweb/authn/jwt.py).
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-htqweb-auth}
      SIGNALING_REQUIRE_AUTH: ${SFU_REQUIRE_AUTH:-true}
      SIGNALING_REQUIRE_TLS: ${SFU_REQUIRE_TLS:-false}
      SIGNALING_DISABLE_ORIGIN_CHECK: ${SFU_DISABLE_ORIGIN_CHECK:-true}
      SIGNALING_ALLOWED_ORIGINS: ${SFU_ALLOWED_ORIGINS:-}
      WEBRTC_LISTEN_IP: ${WEBRTC_LISTEN_IP:-0.0.0.0}
      WEBRTC_ANNOUNCED_IP: ${WEBRTC_ANNOUNCED_IP:-}
      WEBRTC_SERVER_PORT: ${WEBRTC_SERVER_PORT:-44444}
      MEDIASOUP_WORKERS: ${MEDIASOUP_WORKERS:-1}
      # ── Режим TCP-туннеля (scripts/start-public-test.ps1) ──
      # Туннели (bore, ngrok) не умеют UDP, поэтому медиа приходится гнать
      # ICE поверх TCP. Одного TCP_TUNNEL_MODE достаточно: он перетирает
      # WEBRTC_ENABLE_*/PREFER_* внутри sfu/src/config.ts. ANNOUNCED_PORT
      # нужен, когда внешний порт туннеля не совпадает с локальным.
      # Пустые значения безвредны — SFU трактует их как «не задано».
      TCP_TUNNEL_MODE: ${TCP_TUNNEL_MODE:-false}
      WEBRTC_ANNOUNCED_PORT: ${WEBRTC_ANNOUNCED_PORT:-}
      # TURN-релей: страховка для клиентов за строгим NAT.
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      # ── Запись конференций (sfu/src/recording.ts) ──
      # SFU вешает PlainTransport на каждую дорожку и ремуксит её ffmpeg'ом
      # в /recordings/<session_id>/. Сведением и распознаванием занимается
      # backend-media-worker, которому смонтирован тот же том.
      CONFERENCE_RECORDING_ENABLED: ${CONFERENCE_RECORDING_ENABLED:-true}
      CONFERENCE_RAW_DIR: /recordings
      # Куда рассказывать о встрече. Внутреннее имя сервиса: канал не выходит
      # за пределы docker-сети и наружу не публикуется.
      CONFERENCE_BACKEND_URL: ${CONFERENCE_BACKEND_URL:-http://backend-web:8000}
      # Тот же секрет, что у Django. Пустой = SFU не пишет и не журналирует
      # (файлы, о которых некому рассказать, — это просто мусор на диске).
      CONFERENCE_INTERNAL_TOKEN: ${CONFERENCE_INTERNAL_TOKEN:-}
      RECORDER_RTP_PORT_MIN: ${RECORDER_RTP_PORT_MIN:-45000}
      RECORDER_RTP_PORT_MAX: ${RECORDER_RTP_PORT_MAX:-45999}
    volumes:
      - conference_raw:/recordings
    ports:
      - "4443:4443"
      - "${WEBRTC_SERVER_PORT:-44444}:${WEBRTC_SERVER_PORT:-44444}/udp"
      - "${WEBRTC_SERVER_PORT:-44444}:${WEBRTC_SERVER_PORT:-44444}/tcp"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:4443/healthz',
          r => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ─── Frontend builder (one-shot) ────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite подставляет import.meta.env.* на сборке, поэтому среда приходит
        # аргументом сборки, а не переменной контейнера (см. frontend/Dockerfile).
        VITE_HTQ_ENV: ${HTQ_ENV:-production}
        VITE_FALLBACK_MODE: ${FALLBACK_MODE:-}
    volumes:
      - frontend_dist:/html
    restart: "no"

  # ─── Nginx (reverse proxy + frontend + SSL) ─────
  # Only starts under the "production" profile. In dev, Vite on :3000 proxies
  # directly to each FastAPI service, so nginx isn't needed and stale upstream
  # resolution would leave the container in an unhealthy state.
  nginx:
    image: fholzer/nginx-brotli:latest
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      # SSL: Let's Encrypt certificates
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - sfu
      - backend-web
      - backend-asgi
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Метрики шлюза ──────────────────────────────
  # В том же профиле, что и nginx: без него скрейпить нечего, и вне
  # production сервис молча висел бы с down-таргетом.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    restart: unless-stopped
    profiles:
      - production
    command:
      - "--nginx.scrape-uri=http://nginx:80/stub_status"
    depends_on:
      - nginx
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Certbot (Let's Encrypt SSL) ────────────────
  # Run once to obtain certificate, then renews automatically.
  # Usage:
  #   docker compose run --rm certbot certonly --webroot \
  #     -w /var/www/certbot -d your-domain.com --email your@email.com --agree-tos
  # Auto-renewal cron:
  #   docker compose run --rm certbot renew && docker compose restart nginx
  certbot:
    image: certbot/certbot:latest
    # Only needed in production (Let's Encrypt issuance + renewal for nginx).
    # Dev flow is plain HTTP; this container stays off the default profile
    # so it doesn't spin up pointlessly on localhost.
    profiles:
      - production
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # By default: do nothing (run manually or via cron)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─── WebTransport Proxy (QUIC signaling) ────────
  # Мост браузер ──QUIC/HTTP3──► :4433 ──WebSocket──► SFU. Токен из query
  # CONNECT-запроса пробрасывается в SFU (заголовки туда не доходят).
  #
  # Сертификат: по умолчанию самоподписанный из тома wt_certs (браузер примет
  # его только через serverCertificateHashes — см. CONFERENCE_WT_CERT_HASHES).
  # В прод смонтируйте сюда live-сертификат certbot'а.
  webtransport:
    build:
      context: ./webtransport
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SFU_WS_URL: ${SFU_WS_URL:-ws://sfu:4443/ws/sfu/}
      WT_HOST: "0.0.0.0"
      WT_PORT: "4433"
      LOG_LEVEL: ${WT_LOG_LEVEL:-INFO}
      # Прод: укажите живой сертификат домена из тома certbot'а, например
      # WT_CERT_FILE=/etc/letsencrypt/live/<домен>/fullchain.pem
      # WT_KEY_FILE=/etc/letsencrypt/live/<домен>/privkey.pem
      # Тогда самоподписанный не выпускается, а отпечатки фронту не нужны.
      CERT_FILE: ${WT_CERT_FILE:-certs/cert.pem}
      KEY_FILE: ${WT_KEY_FILE:-certs/key.pem}
      # SAN самоподписанного сертификата (dev): localhost и 127.0.0.1 всегда,
      # остальное — сюда через запятую (например LAN-IP хоста).
      WT_CERT_HOSTS: ${WT_CERT_HOSTS:-}
    ports:
      - "4433:4433/udp"
    volumes:
      - wt_certs:/app/certs
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - sfu
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Prometheus (Metrics Storage & Scraper) ─────
  prometheus:
    build:
      context: ./infra/logging/prometheus
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Уезжает в external_labels каждой серии (--enable-feature=
      # expand-external-labels). Разделяет данные стендов, если их когда-
      # нибудь сведут в одно хранилище.
      PROMETHEUS_ENV: ${PROMETHEUS_ENV:-production}
    volumes:
      - prometheus_data:/prometheus
    healthcheck:
      # Prometheus serves under route-prefix /prometheus (--web.external-url),
      # so the health endpoint lives at /prometheus/-/healthy — not /-/healthy.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/prometheus/-/healthy || exit 1"]
      interval: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  # ─── Loki (log storage) ─────────────────────────
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 10s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Promtail (docker log shipper) ──────────────
  promtail:
    image: grafana/promtail:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/logging/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── Grafana (logs + dashboards UI) ─────────────
  grafana:
    image: grafana/grafana-oss:10.4.4
    restart: unless-stopped
    # Build a JWKS from the platform-wide HS256 JWT secret before start, so
    # [auth.jwt] accepts the same access tokens user-service issues. The file
    # lands in /tmp (grafana runs unprivileged; /etc/grafana is read-only).
    entrypoint:
      - /bin/sh
      - -c
      - |
        k=$$(printf '%s' "$$JWT_SECRET" | base64 | tr -d '\n=' | tr '+/' '-_')
        printf '{"keys":[{"kty":"oct","use":"sig","alg":"HS256","k":"%s"}]}' "$$k" > /tmp/htqweb-jwks.json
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Без значения по умолчанию намеренно: `admin/admin` на панели, куда
      # стекаются все метрики платформы, — это открытая дверь. Пустая
      # переменная валит старт Grafana, и это правильное поведение: лучше
      # не подняться, чем подняться с общеизвестным паролем. Задаётся в .env
      # (см. .env.example). Платформенные учётки входят и так — по JWT SSO,
      # локальный admin нужен только на случай, когда SSO сломан.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD не задан в .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Served behind the edge under /grafana/ (nginx in prod, Vite in dev).
      # serve_from_sub_path keeps direct host access working at :3001/grafana/.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # ─── SSO with platform accounts (HTQWeb JWT, HS256 shared secret) ────
      # Frontend opens /grafana/?auth_token=<access JWT> (url_login). Roles:
      # superuser → Admin, staff → Editor, everyone else is rejected
      # (role_attribute_strict). Local admin/admin login keeps working.
      JWT_SECRET: ${JWT_SECRET:-change-me-to-django-secret-key}
      GF_AUTH_JWT_ENABLED: "true"
      GF_AUTH_JWT_HEADER_NAME: "X-JWT-Assertion"
      GF_AUTH_JWT_URL_LOGIN: "true"
      GF_AUTH_JWT_USERNAME_CLAIM: "username"
      GF_AUTH_JWT_EMAIL_CLAIM: "email"
      GF_AUTH_JWT_AUTO_SIGN_UP: "true"
      GF_AUTH_JWT_JWK_SET_FILE: /tmp/htqweb-jwks.json
      GF_AUTH_JWT_EXPECT_CLAIMS: '{"iss": "htqweb-auth"}'
      GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH: "is_superuser && 'Admin' || is_staff && 'Editor'"
      GF_AUTH_JWT_ROLE_ATTRIBUTE_STRICT: "true"
      # Land admins straight on the service-metrics dashboard after login.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/htqweb-prometheus-services.json
      # ─── Доставка алертов ───────────────────────────────────────────────
      # Подставляются в contact_points.yml через $__env{...}: токен бота в
      # репозитории лежать не должен. Пустые значения = канал молчит.
      # Плейсхолдеры, а НЕ пустые строки: Grafana валидирует контактные
      # точки при старте и с пустым bot token отказывается подниматься
      # целиком («could not find Bot Token in settings»). Ронять всю панель
      # из-за ненастроенного канала — хуже, чем подняться с нерабочим
      # каналом: ошибка доставки видна в Alerting → Notification history и
      # в логах, то есть не молчит.
      GF_TELEGRAM_BOT_TOKEN: ${GF_TELEGRAM_BOT_TOKEN:-000000:PLACEHOLDER-set-in-dotenv}
      GF_TELEGRAM_CHAT_ID: ${GF_TELEGRAM_CHAT_ID:-0}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_SKIP_VERIFY: ${GF_SMTP_SKIP_VERIFY:-false}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/logging/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./infra/logging/grafana-dashboards:/etc/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
  static_files:
  media_files:
  wt_certs:
  # Сырые дорожки конференций: пишет sfu, читает и подчищает
  # backend-media-worker. Живут часы — от конца встречи до готового mp4.
  conference_raw:
  # Веса Whisper. Отдельным томом, чтобы пересборка образа не заставляла
  # качать полтора гигабайта заново.
  whisper_models:
  frontend_dist:
  certbot_conf:
  certbot_webroot:
  loki_data:
  grafana_data:
  minio_data:
  prometheus_data:
